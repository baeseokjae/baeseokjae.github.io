{{- if and (eq .Page.Kind "page") (eq .Page.Section "posts") .Page.Params.aliases -}}
<!doctype html>
<html lang="{{ site.Language.Locale }}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Article moved | {{ site.Title }}</title>
  <link rel="canonical" href="{{ .Permalink }}">
  <meta http-equiv="refresh" content="0; url={{ .Permalink }}">
</head>
<body>
  <p>This article has moved to <a href="{{ .Permalink }}">{{ .Page.Title }}</a>.</p>
</body>
</html>
{{- else -}}
<!DOCTYPE html>
<html lang="{{ site.Language.Locale }}">
  <head>
    <title>{{ .Permalink }}</title>
    {{ with .OutputFormats.Canonical }}<link rel="{{ .Rel }}" href="{{ .Permalink }}">{{ end }}
    <meta charset="utf-8">
    <meta http-equiv="refresh" content="0; url={{ .Permalink }}">
  </head>
</html>
{{- end -}}
