      "acceptedAnswer": {
        "@type": "Answer",
        "text": "\"Extensible software in the age of LLMs\" describes applications whose feature surface is deliberately smaller than their behavior surface: a maintained core ships stable extension points, and users add the features they personally need — increasingly by describing them in prose that a model turns into code."
      }
    },
    {

      "acceptedAnswer": {
        "@type": "Answer",
        "text": "Morrell's diagnosis starts with a constraint most product teams feel but rarely name: **attention is finite, and every feature you add taxes every user who did not ask for it.**"
      }
    },
    {
      "@type": "Question",
      "name": "What Changed When LLMs Made Software-for-One Cheap?",
      "acceptedAnswer": {
        "@type": "Answer",
        "text": "The veto is gone. Morrell's central claim is that LLMs made **\"Software for One\"** cheap: people can now ask for a one-off tool and get it. The bottleneck moved."
