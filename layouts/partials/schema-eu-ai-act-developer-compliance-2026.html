      "acceptedAnswer": {
        "@type": "Answer",
        "text": "A provider is the entity that develops or places an AI system on the market (typically the company that trains or builds the model). A deployer is the entity that uses a third-party AI system in a professional context. Both can have obligations: providers face the full technical documentation and conformity assessment requirements; deployers must implement human oversight, maintain logs, and register in the EU database for high-risk systems."

      "acceptedAnswer": {
        "@type": "Answer",
        "text": "Most general B2B SaaS AI tools are not high-risk. The Annex III categories are specifically enumerated: employment screening, credit scoring, educational assessment, biometrics, critical infrastructure, law enforcement, migration, and justice administration. If your tool doesn't make consequential decisions in those specific domains, it likely falls in the minimal or transparency-only category."

      "name": "Do open-source AI models get exempted from EU AI Act requirements?",
      "acceptedAnswer": {
        "@type": "Answer",
        "text": "Partially. Open-source GPAI models with published weights are exempt from commercial technical documentation requirements but still must publish a training data summary for copyright compliance. This exemption disappears if the model crosses the systemic-risk threshold (≥10²⁵ training FLOPs). For high-risk AI systems (Annex I/III), releasing the system as open-source does not exempt it from compliance obligations."
