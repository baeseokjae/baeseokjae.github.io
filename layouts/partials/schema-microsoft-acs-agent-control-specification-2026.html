        "@type": "Answer",
        "text": "ACS is not only for Microsoft agent platforms. Microsoft introduced and documents much of the current ecosystem, but the specification is framed as open and vendor-neutral. Its value depends on support from non-Microsoft frameworks, SDKs, observability systems, policy engines, and security vendors."

      "@type": "Question",
      "name": "Does ACS replace MCP?",
      "acceptedAnswer": {
        "@type": "Answer",
        "text": "ACS does not replace MCP. MCP standardizes how agents connect to tools and external resources, while ACS standardizes how runtime policy decisions can be made around agent behavior. MCP tool metadata can become evidence for ACS decisions."
      }
    },
    {
      "@type": "Question",
      "name": "Can ACS stop prompt injection?",
      "acceptedAnswer": {
        "@type": "Answer",
        "text": "ACS can reduce the blast radius of prompt injection, but it cannot eliminate prompt injection by itself. A runtime policy can deny unsafe tool calls or outputs caused by a malicious prompt, but the prompt injection still needs separate detection and mitigation."
      }
