    {
      "@type": "Question",
      "name": "What is a requirement ledger in vibe coding?",
      "acceptedAnswer": {
        "@type": "Answer",
        "text": "A requirement ledger is a local, retrospective record of what a project actually required, reconstructed from artifacts the vibe-coding session already produced: the agent transcript, the test log, and a read-only Git snapshot. It inverts spec-driven development's direction — instead of writing a specification before prompting, you recover the specification afterwards from the corrections the user made while the work was happening. The anchor implementation is the MIT-licensed `adand-91/requirement-ledger`, which explicitly does not edit your project: it gathers evidence and produces a DRAFT repair plan that your own agent applies under review."
      }
    },
    {
      "@type": "Question",
      "name": "Does a requirement ledger replace spec-driven development?",
      "acceptedAnswer": {
        "@type": "Answer",
        "text": "No, and treating it that way wastes both. Spec-driven development as Böckeler taxonomises it — spec-first, spec-anchored, spec-as-source — is prospective: the spec exists before the code and governs it. A requirement ledger is retrospective: it recovers intent from sessions where no spec was ever written, which is the majority of AI-assisted work in most organisations. Use SDD for planned features you are deliberately designing, and use a ledger for the accumulated drift in everything you already shipped, where a prospective spec is unavailable because the conversation that produced the code is the only remaining record."
      }
    },
    {
      "@type": "Question",
      "name": "How many words should a recovered requirement document be?",
      "acceptedAnswer": {
        "@type": "Answer",
        "text": "Far fewer than a spec-kit run produces. Marmelab measured a spec-kit run for one small feature generating 8 files and 1,300 lines of text, which is the failure mode to avoid. AfterVibe's environmental grounding hypothesis gives the useful bound: a specification only needs to be concrete about undiscoverable facts such as decisions, thresholds and domain constraints, because an agent can discover build configuration, naming, module structure and API contracts by reading the repository. Recover the few things that exist only in someone's head, and let everything recoverable stay discoverable."
      }
    },
    {
      "@type": "Question",
      "name": "How do I know a recovered requirement set is actually correct?",
      "acceptedAnswer": {
        "@type": "Answer",
        "text": "Test it by regeneration rather than by reading it. AfterVibe rebuilds the artifact from the recovered spec alone with a second blind agent and judges equivalence through flexible test execution, verification conditions extracted from the trajectory, and ground-truth alignment. Across 72 real-world vibe-coded tasks, recovered specs averaged 5.06 out of 6.0, rising to 5.74 out of 6.0 after iterative strengthening, while remaining diverse in implementation detail. The practical rule is that if a blind agent cannot rebuild a passing change from your recovered spec, the spec is under-specified — regardless of how complete it reads."
      }
    },
    {
      "@type": "Question",
      "name": "Why must an AI never estimate the numbers in a retrospective?",
      "acceptedAnswer": {
        "@type": "Answer",
        "text": "Because a retrospective number gets quoted later as fact, and an invented count ends the enquiry that a missing count would have started. The `requirement-ledger` project makes this its central rule: every number comes from the script and the model never estimates one, with counting messages by eye described in the tooling as \"a failed retrospective.\" The human-factors literature makes the stakes concrete — Shaw and Nave at Wharton found people follow AI advice roughly 80% of the time even when it is wrong, so an authoritative-sounding wrong count is a documented hazard rather than a typo."
      }
    }
