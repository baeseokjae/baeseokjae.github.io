      "@type": "Question",
      "name": "What is BDD in simple terms?",
      "acceptedAnswer": {
        "@type": "Answer",
        "text": "Behavior-driven development is a practice where requirements are written in ordinary language and each step is bound to executable code. The spec is readable by non-engineers and runnable by machines. The point is that the documentation cannot silently drift, because it fails the build when the system stops matching it."
      }
    },
    {
      "@type": "Question",
      "name": "Is Yadda better than Cucumber for AI coding agents?",
      "acceptedAnswer": {
        "@type": "Answer",
        "text": "Not universally. Yadda is better if you want zero runtime dependencies, no runner lock-in, non-rigid step syntax, and dictionaries that can source step data from external systems. Cucumber is better if you need its ecosystem, its reporter and plugin tooling, or browser-based step support. For agent work specifically, the properties that matter are executable binding and the ability to keep tests outside the agent's reach — both tools provide that. Yadda's flexibility is a preference, not a correctness advantage."
      }
    },
    {
      "@type": "Question",
      "name": "Should the same AI agent write the tests and the implementation?",
      "acceptedAnswer": {
        "@type": "Answer",
        "text": "No. If one agent implements a feature and can also edit the tests until they pass, a green suite stops being evidence — the agent can change the definition of correct at the same time as the implementation. Commit the failing test first as a tamper seal, tell the agent not to modify existing tests, and enforce the rule with a pre-commit hook or CI job rather than a prompt instruction. Project Prometheus's \"Intent-Behavior Mirroring Effect\" and the reward-hacking behaviours catalogued by benchmarks like ImpossibleBench are what this rule defends against."
      }
    },
    {
      "@type": "Question",
      "name": "Does Yadda 3.0 work in the browser?",
      "acceptedAnswer": {
        "@type": "Answer",
        "text": "No. Yadda 3.0 is Node-only, requires Node.js >= 20, and dropped browserify bundling and in-browser bundles entirely (issues 320–322 of the modernisation epic). For browser end-to-end BDD, `playwright-bdd` or `@badeball/cypress-cucumber-preprocessor` are the conventional choices."
      }
    },
    {
      "@type": "Question",
      "name": "How long does it take to migrate from Yadda 2 to Yadda 3?",
      "acceptedAnswer": {
        "@type": "Answer",
        "text": "It depends on how much of the removed surface you used. Every breaking change is enumerated per issue in the changelog and `docs/migrating-to-3.md`: browser bundling (320), `lib/Platform.js` (321), `lib/shims` (322), the version string in `String(yadda)` (323), `'use strict'` in source (324), `nyc` in favour of built-in `node:test` coverage (325), and `bin/rev.sh` (326). A Node-only project that used Yadda as a library typically has a small change surface; anything relying on in-browser execution needs a different tool rather than a migration."
      }
