      "name": "Should I use JWT or database sessions for an AI chatbot?",
      "acceptedAnswer": {
        "@type": "Answer",
        "text": "For consumer AI chatbots: JWT sessions are usually sufficient — they're faster (no DB query per request) and the risk of an un-revocable compromised session is low for consumer apps. For B2B AI products: use database sessions so admins can force-logout compromised accounts immediately. The extra 5–15ms per request is worth the security guarantee when enterprise data is involved."

      "name": "How do I handle authentication with streaming AI responses?",
      "acceptedAnswer": {
        "@type": "Answer",
        "text": "Validate the session before initiating the stream, not during. Once the stream starts, you cannot easily interrupt it for auth re-validation without breaking the streaming connection. The pattern: call auth() → validate → start ai.streamText() → pipe to Response. Set stream TTL shorter than session expiry (e.g., max 60-second streams if session expires in 30 minutes)."
      }
