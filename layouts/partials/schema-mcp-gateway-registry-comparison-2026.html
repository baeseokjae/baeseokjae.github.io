      "name": "What's the difference between an MCP registry and an MCP gateway?",
      "acceptedAnswer": {
        "@type": "Answer",
        "text": "An MCP registry is a catalog for discovering MCP servers (like Docker Hub for MCP). An MCP gateway handles authentication, authorization, routing, and audit logging between agents and MCP servers. They're complementary layers — you use a registry to find a server and a gateway to govern access to it."

      "name": "Does AWS support MCP gateways?",

    {
      "@type": "Question",
      "name": "What is MCP per-user credential brokering?",
      "acceptedAnswer": {
        "@type": "Answer",
        "text": "Per-user credential brokering means the gateway resolves each human user's identity (via OAuth 2.1, OIDC, or similar) and injects their scoped credentials into MCP tool calls. This means Alice's agent calls use Alice's database credentials, and Bob's calls use Bob's. Without this, the gateway uses a single shared credential, which breaks audit trails and compliance requirements."
