      "@type": "Question",
      "name": "The 2026 evidence: how big is the harness effect, really?",
      "acceptedAnswer": {
        "@type": "Answer",
        "text": "Four independent lines of evidence converged on \"as large as the model term,\" and they measured it in different ways. The Claw-SWE-Bench paper is the cleanest of these because harness is a controlled experimental variable: 350 tasks across 8 languages and 43 repositories. Five claws running on GLM 5.1 span 60.9% to 73.4% — a 12.5-point spread with the model held fixed. On Qwen 3.6-flash the spread widens to 38.6%–66.0%. Weaker models are more sensitive to harness quality, not less."
      }
    },
    {
      "@type": "Question",
      "name": "Finding 1: Is context management a reasoning upgrade or budget insurance?",
      "acceptedAnswer": {
        "@type": "Answer",
        "text": "This is the most actionable result in the paper, and it is routinely misread. The value of context management is almost entirely a function of how likely your runs are to run out of window."
      }
    },
    {
      "@type": "Question",
      "name": "Finding 2: Should you elide, summarize, or build lossless recall?",
      "acceptedAnswer": {
        "@type": "Answer",
        "text": "Two sub-results here, and the second one is a warning about shipping features you never measure. First, ordering matters. Staged elision-then-summarization (T4) matches the accuracy of T1 through T3 while posting the lowest cost in 7 of 8 model-benchmark panels and the lowest mean cost per task at every window budget (Section 3.2, Figures 4 and 5). The reason is arithmetic: early cheap elision removes material before it can be sent to a costly LLM summarization call. You pay for summarization only on what survived truncation."
      }
    },
    {
      "@type": "Question",
      "name": "Finding 3: Do you actually need a planning step?",
      "acceptedAnswer": {
        "@type": "Answer",
        "text": "Planning is not universally good or universally bad. Its sign depends on model capability, and the mechanism explains why."
      }
