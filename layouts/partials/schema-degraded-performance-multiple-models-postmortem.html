      "acceptedAnswer": {
        "@type": "Answer",
        "text": "It means requests are completing but below normal standard — partial errors, elevated latency, or unusable output. It is deliberately distinct from a full outage, and it covers most of the incident record: status.openai.com shows 112 outages since January 27, 2026, dominated by degraded-performance events rather than clean outages. Your uptime percentage will not move during one of these windows."

      "acceptedAnswer": {
        "@type": "Answer",
        "text": "Pin a manifest with every eval run: model ID and provider version string, system-prompt hash, tool-schema hash, sampling parameters, SDK/CLI versions, retry policy and concurrency. Then diff the manifest across the two windows before diffing model outputs. A changed harness looks exactly like a changed model, so the manifest diff is the first artefact you should produce."
