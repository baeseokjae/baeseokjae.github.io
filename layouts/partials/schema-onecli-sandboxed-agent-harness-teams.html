      "@type": "Question",
      "name": "What Is OneCLI, and Why Did It Pivot From a Credential Vault to an Agent Harness?",
      "acceptedAnswer": {
        "@type": "Answer",
        "text": "OneCLI is an open-source platform that runs each employee's AI agent inside its own sandbox and forces every outbound network request through a policy-enforcing Rust gateway that injects credentials on the agent's behalf. The project began in March 2026 as a Rust credential vault for AI agents and pivoted in August 2026 into a full agent harness for teams."
      }
    },
    {
      "@type": "Question",
      "name": "Is OneCLI really open source?",
      "acceptedAnswer": {
        "@type": "Answer",
        "text": "Mostly, with a carve-out worth reading before you plan a deployment. The repository is Apache-2.0 except for three paths — `apps/web/src/ee/`, `packages/api/src/ee/` and `apps/gateway/crates/ee/` — which carry the OneCLI Enterprise License: free for development, testing and evaluation, with production use requiring a subscription. The license file states that everything outside those paths is Apache-2.0 and self-hostable in production with no commercial license. The `ee/` folder is not visible at the repository root, which is why a commenter on the Launch HN thread asked where it was."
      }
    },
    {
      "@type": "Question",
      "name": "Does OneCLI stop prompt injection?",
      "acceptedAnswer": {
        "@type": "Answer",
        "text": "No, and the company does not claim it does. It removes one consequence — the agent cannot leak a credential it never holds — and it gives you a deterministic place to block or approve individual requests. A prompt-injected agent can still misuse a service you legitimately granted it, and a gateway matching on host, method, path and body cannot tell whether the instruction behind a request came from you or from a retrieved document. Treat OneCLI as blast-radius and reach control, not as injection defense."
      }
    },
    {
      "@type": "Question",
      "name": "Do I still need a sandbox if I use OneCLI?",
      "acceptedAnswer": {
        "@type": "Answer",
        "text": "Yes. OneCLI does run each agent in its own sandbox — a micro-VM on OneCLI Cloud — but the sandbox and the gateway solve different problems. The sandbox bounds what the agent can break locally; the gateway bounds what it can reach externally. NanoClaw's own framing after adopting OneCLI is exactly this split: NanoClaw solves runtime isolation, OneCLI solves credential isolation and policy enforcement. Run both, and remember that sandbox escapes recur in the tooling itself, as CVE-2026-39861 in Claude Code showed."
      }
    },
