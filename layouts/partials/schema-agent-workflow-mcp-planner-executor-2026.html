      "@type": "Question",
      "name": "What Is the Planner-Executor Pattern?",
      "acceptedAnswer": {
        "@type": "Answer",
        "text": "The planner-executor pattern is a core multi-agent orchestration architecture in which a single \"planner\" agent owns strategy and a separate \"executor\" agent (or a pool of executors) owns tool execution. The planner receives the high-level goal, decomposes it into discrete steps, and hands each step to an executor. The executor performs the work — often calling tools, searching, or running code — and returns a condensed result. The planner then decides whether to proceed, adjust, or re-plan."
      }
    }
  ]
