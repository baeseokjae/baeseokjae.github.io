      "name": "Why do coding agents lose the thread in the first place?",
      "acceptedAnswer": {
        "@type": "Answer",
        "text": "The tool is aimed at a specific failure. Run four agents in four worktrees and the decomposition of the work exists only in the prompt you typed and in each agent's private context. When you learn at step four that step one was misread, there is nothing to edit — only something to undo."
      }

        "@type": "Answer",
        "text": "Install globally, then plan. The interactive path is the intended one. ```bash npm install -g ordewell ``` Run `ordewell` inside your project to open the terminal UI and type a goal. On the first run you pick a planner and your runners with `/planner` and `/runners`. For anyone who wants a goal out of a script rather than a chat, the same pipeline is exposed on the CLI:"
      }

    {
      "@type": "Question",
      "name": "Step 2: How do you read a plan before a token is spent?",
      "acceptedAnswer": {
        "@type": "Answer",
        "text": "The plan is a typed JSON artifact per session, stored under `.ordewell/sessions/`, with the conversation persisted separately. It is not an agent's internal state and not a message in a log. That distinction is what makes the next sentence possible: you can rewrite any part of the plan without another round trip to the model, and without losing work that has already completed."
