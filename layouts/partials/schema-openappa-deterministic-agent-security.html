      "@type": "Question",
      "name": "What is OpenAPPA in one sentence?",
      "acceptedAnswer": {
        "@type": "Answer",
        "text": "OpenAPPA is an MIT-licensed, Rust-based deterministic security engine that sits between an agent and its tools, labels what the agent has read as audience x trust, and checks every tool call against declarative TOML contracts before dispatch, returning remedy plans instead of bare refusals."
      }
    },
    {
      "@type": "Question",
      "name": "Is OpenAPPA the same as OPA or Cedar?",
      "acceptedAnswer": {
        "@type": "Answer",
        "text": "No. OPA, Cedar, and Dogwood are general-purpose policy engines that give you allow-or-deny decisions over context your application supplies, and they can express arbitrary business rules that OpenAPPA deliberately cannot. The difference is state: OpenAPPA tracks the agent's action history and carries data restrictions forward between calls, and it returns recovery options rather than only a verdict."
      }
    },
    {
      "@type": "Question",
      "name": "Does OpenAPPA replace prompt-injection detection tools?",
      "acceptedAnswer": {
        "@type": "Answer",
        "text": "It complements them. Detectors classify content and can be wrong, which is fine when their verdicts are advisory; OpenAPPA wraps them. A model-backed annotator, authority, or sanitizer runs inside a declared mandate, so a third-party scanner that errs cannot grant permissions beyond its contract, and the information-flow engine keeps the global invariant regardless of what the model concludes."
      }
    },
    {
      "@type": "Question",
      "name": "What does OpenAPPA cost in tokens and task completion?",
      "acceptedAnswer": {
        "@type": "Answer",
        "text": "Its vendor reports 4.22% token overhead on Tau Bench's banking tasks, but 6.5x the tokens of a permissive policy on Bench-Corp and 2.3x on AgentThreatBench in the attack suites, because isolated child trajectories and recovery run on top of the task. Task completion was 88-90% on Bench-Corp against FIDES's 37-45%, but 75% in the single-run head-to-head where auto-mode configurations reached 85-96%."
      }
    },
    {
      "@type": "Question",
      "name": "Is OpenAPPA production-ready in 2026?",
      "acceptedAnswer": {
        "@type": "Answer",
        "text": "Not in the sense of a frozen interface. The project labels itself a preview and an RFC, and config and wire surfaces may break without shims, with five releases in three days at the end of September 2026. What is production-shaped is the practice around it: declarative TOML, `appa replay` policy tests as a required merge check, and a local runtime that fails closed when it cannot answer."
      }
