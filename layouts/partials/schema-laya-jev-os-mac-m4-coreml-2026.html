      "acceptedAnswer": {
        "@type": "Answer",
        "text": "Laya is a 322M–421M parameter non-autoregressive decision model that answers a multiple-choice question in a single forward pass. `mizorewww/laya-coreml` is a community port that compiles those same weights to Core ML so the Neural Engine can run them locally. \"Mac M4\" is a phrase from the fordnox gist description, and the M4 benchmark it implies does not exist anywhere in the repo."
      }

        "text": "Laya is not a chatbot that happens to answer multiple-choice questions. It is a ModernBERT-large encoder, published by `convaiinnovations` on Hugging Face under Apache-2.0 on 2026-09-18, with three variants: a 421M English model at 512 tokens, a 322M multilingual model at 1024 tokens, and a 421M typed-decisions model. It outputs a scored judgement over a supplied option list rather than generating text token by token."

      "name": "What does 45 decisions per second actually measure?",
      "acceptedAnswer": {
        "@type": "Answer",
        "text": "It measures an uncapped game loop on an M3 Max, and it is an average rather than a promise. Across three sequential 600-step Snake episodes — with three model questions per move, 1,800 decisions total — the port sustains 49.1 to 50.0 decisions/s, pooled at 49.66/s, with zero deaths and two safety interventions. The loop was never asked to hold a rate. It was allowed to run as fast as it could."
