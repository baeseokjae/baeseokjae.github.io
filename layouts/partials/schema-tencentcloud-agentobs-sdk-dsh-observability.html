    {
      "@type": "Question",
      "name": "Is the TencentCloud AgentObs SDK worth using for dsh agent observability?",
      "acceptedAnswer": {
        "@type": "Answer",
        "text": "Yes, if you already run Tencent Cloud Log Service and want traces with no collector to operate. No, if you are not a CLS customer, need content capture off by default, or want vendor-neutral trace semantics. It is a strong fit inside the Tencent Cloud stack and a lock-in purchase outside it."
      }
    },
    {
      "@type": "Question",
      "name": "Does the TencentCloud AgentObs SDK capture prompts and tool output by default?",
      "acceptedAnswer": {
        "@type": "Answer",
        "text": "Yes. It ships with `captureContent: true` and a `contentMaxChars` cap of 128,000, which attaches prompts, responses, tool arguments and tool results to spans by default. The community OpenTelemetry plugin ships content capture off by default. For a coding agent that reads source trees and `.env` files, disable it in the profile before rolling out."
      }
    },
    {
      "@type": "Question",
      "name": "How much does CLS Agent Observability cost for a DSH fleet?",
      "acceptedAnswer": {
        "@type": "Answer",
        "text": "At small scale, very little: roughly $0.20 to $0.45 per month for 10 to 100 agent tasks a day, where the fixed partition charge dominates. At 20,000 tasks a day, the variable bill runs about $39 per month at a 35% index ratio, or about $17 per month with indexing disabled. Index traffic is billed on uncompressed volume at roughly 2x the write-traffic rate, so index configuration — not trace count — drives the bill."
      }
    },
    {
      "@type": "Question",
      "name": "Can I run the TencentCloud AgentObs SDK alongside an OpenTelemetry tracing plugin?",
      "acceptedAnswer": {
        "@type": "Answer",
        "text": "No. The DeepSeek Harness telemetry seam `@deepseek-ai/dsh-session-telemetry` accepts exactly one backend per context and throws at load time if you register a second. The Tencent plugin, the OTel plugins and the harness's own OTLP-logs exporter are mutually exclusive; evaluating two of them requires two separate profiles."
      }
    },
    {
      "@type": "Question",
      "name": "What happens if my CLS credentials expire while the plugin is running?",
      "acceptedAnswer": {
        "@type": "Answer",
        "text": "The harness does not fail. A 401 from CLS leaves the agent run successful and the process exits 0, while traces silently stop appearing. Because observability failures are deliberately non-fatal to the workload, \"no traces\" and \"no problems\" look identical — add an independent synthetic check that asserts a known trace lands in your topic on a schedule."
      }
    }
