      "name": "What Is the Agent Harness, Anyway?",
      "acceptedAnswer": {
        "@type": "Answer",
        "text": "The phrase \"Agent = Model + Harness\" is not marketing spin; it is a structural claim about where reliability actually comes from. Martin Fowler defines the harness as everything around the model — the outer user harness that shapes how an agent behaves before, during, and after a coding task. That outer harness serves two goals: raise the odds of first-try success, and build a self-correction loop that works before a human ever reviews the result."
