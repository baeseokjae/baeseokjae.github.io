      "acceptedAnswer": {
        "@type": "Answer",
        "text": "LLMs show up to 72% variance across runs even at temperature=0, and pass rates drop to 60-80% when run 100 times on the same task despite 90%+ demo accuracy. Single-digit demos hide this variance — you need multi-trial testing with confidence intervals to detect it."

      "@type": "Question",
      "name": "What is tool selection drift in AI agents?",
      "acceptedAnswer": {
        "@type": "Answer",
        "text": "Tool selection drift is when an agent that consistently picks the right tool in testing randomly calls the wrong tool with wrong parameters in production. It happens because context window shifts change how the model ranks tool descriptions. The fix is pre-validated execution plans, action deduplication, and human-in-the-loop approval gates for destructive operations."
      }
    },

      "@type": "Question",
      "name": "What is the 12-factor agent architecture?",
      "acceptedAnswer": {
        "@type": "Answer",
        "text": "The 12-Factor Agents methodology treats agents as software engineering problems, not prompt engineering problems. Key principles include owning your prompts and context window, treating tools as structured outputs, using small focused agents over monolithic loops, and applying the stateless reducer pattern to manage context window pressure."
      }
    },
    {
      "@type": "Question",
      "name": "How should you test AI agents for production reliability?",
      "acceptedAnswer": {
        "@type": "Answer",
        "text": "Run every test scenario at least 30 times and calculate pass rates with Wilson confidence intervals, cost variance, and latency variance. Use step-level failure attribution (like the Fisher exact test) to identify which specific step fails. Apply chaos engineering principles with tools like Flakestorm to test timeout handling, error recovery, and state persistence."
      }
