      "name": "How does the OpenAI Agents SDK + Temporal integration handle OpenAI API rate limits?",
      "acceptedAnswer": {
        "@type": "Answer",
        "text": "Rate limit errors from OpenAI's API surface as ActivityError exceptions in Temporal activities. The activity_as_tool() pattern lets you configure a RetryPolicy with maximum_attempts, initial_interval, and backoff_coefficient — so a 429 rate limit response triggers automatic exponential backoff without any application code changes. The agent loop pauses, the activity retries transparently, and execution resumes exactly where it stopped."
      }
    },

      "name": "Can I use OpenAI Agents SDK + Temporal with models other than OpenAI (Claude, Gemini, Llama)?",
      "acceptedAnswer": {
        "@type": "Answer",
        "text": "Yes. The OpenAI Agents SDK supports custom model providers via the ModelProvider interface. You can configure the SDK to use Anthropic's Claude API, Google Gemini, or local models via OpenAI-compatible endpoints (Ollama, vLLM). The Temporal integration is model-agnostic — it wraps the Runner execution loop regardless of which model provider you use underneath."
      }
    },

      "name": "What's the performance overhead of adding Temporal to my agent?",
      "acceptedAnswer": {
        "@type": "Answer",
        "text": "Each activity call adds approximately 5-15ms of Temporal overhead (event log write + worker poll) compared to direct Python function calls. For activities that call external APIs (LLMs, databases, web search), this overhead is negligible — a 500ms API call with 10ms Temporal overhead is a 2% penalty. The overhead matters only for high-frequency, low-latency local computations — which should not be implemented as Temporal activities in the first place."
      }
