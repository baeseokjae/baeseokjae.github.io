  "@context": "https://schema.org",

  "mainEntity": [
    {
      "@type": "Question",
      "name": "What is an MCP proxy in one sentence?",
      "acceptedAnswer": {
        "@type": "Answer",
        "text": "An MCP proxy reads your REST API's OpenAPI specification, translates each operation into an MCP tool, and forwards the resulting calls back to your existing HTTP endpoints — so an agent can use your API as MCP without any change to the API itself."
      }
    },
    {
      "@type": "Question",
      "name": "Do I need to modify my REST API to add MCP support?",
      "acceptedAnswer": {
        "@type": "Answer",
        "text": "No. That is the point of every tool covered here. Kong's plugin, Azure APIM, AWS API Gateway's MCP proxy, FastMCP's `from_openapi()` and `openapi-mcp-generator` all consume your existing spec and call your existing routes. Authentication is configured on the bridge's side, in headers or a gateway policy."
      }
    },
    {
      "@type": "Question",
      "name": "Which is better for a REST API to MCP bridge — a managed gateway or a self-hosted proxy?",
      "acceptedAnswer": {
        "@type": "Answer",
        "text": "Use a managed gateway (Kong, Azure APIM, AWS API Gateway) when you already run one and want auth, rate limiting and audit inherited for free — roughly 30% of MCP deployments are gateway-based, and the security statistics argue for it. Use a self-hosted runtime proxy like FastMCP when you need fine-grained curation, route-level transforms, or freedom from enterprise tier licensing. A large share of teams end up hybrid: gateway for policy, a curated proxy for the tool surface."
      }
    },
    {
      "@type": "Question",
      "name": "Is mcpo a REST-to-MCP bridge?",
      "acceptedAnswer": {
        "@type": "Answer",
        "text": "No — it is the opposite direction. `mcpo` exposes an MCP server as an OpenAPI/REST HTTP server so that OpenAPI-only clients can call it. If your goal is to give an agent access to a REST API, `mcpo` is not the tool, despite appearing in many \"REST to MCP\" roundups."
      }
    },
    {
      "@type": "Question",
      "name": "Why does my auto-generated MCP server make the agent slower?",
      "acceptedAnswer": {
        "@type": "Answer",
        "text": "Because every tool's name, description and parameter schema is re-processed on every reasoning step, and because one tool per REST operation forces a full model round trip per step. The converter's own author recommends against mass conversion: auto-convert to discover the surface, then collapse it to 5–15 outcome-oriented tools with descriptive names and trimmed response payloads before you let an agent near it."
      }
    }
  ]
