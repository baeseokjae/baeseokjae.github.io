      "acceptedAnswer": {
        "@type": "Answer",
        "text": "A requirement ledger is a versioned record of intent, decisions, and constraints that lives in the repository and represents the authoritative statement of what you are building. It is not a prompt file, and it is not documentation for readers. It is the working contract between you and the model — the thing every generation reads before it writes, and the thing you consult to decide whether the model actually delivered."
