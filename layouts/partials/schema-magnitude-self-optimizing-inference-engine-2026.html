    {
      "@type": "Question",
      "name": "What is Magnitude?",
      "acceptedAnswer": {
        "@type": "Answer",
        "text": "Magnitude is an Apache-2.0 local inference engine and desktop app from Magnitude AI (YC S25). It assesses your hardware from metadata - deriving the device's memory bandwidth from the driver's report, a published specification, or the device class, with nothing run on the device - ranks complete model, quantization and context configurations for that machine, compiles and tunes its own kernels on the device, then serves the model on localhost:10100 and rewrites your coding agent's config to use it. The engine is Rust around Seismic, its numerical compiler and runtime for CPU, Metal, CUDA and Vulkan."
      }
    },
    {
      "@type": "Question",
      "name": "Is \"up to 2x faster than llama.cpp\" true?",
      "acceptedAnswer": {
        "@type": "Answer",
        "text": "It is true for exactly the two configurations Magnitude published: Qwen 3.6 35B-A3B at 4-bit, 64k context, no speculative decoding - decode 30 to 57 tok/s (+92%) on an M4 Pro 48 GB via Metal, and 49 to 58 tok/s (+19%) on a DGX Spark via CUDA, where prefill gains were +9% and +23%. Both engines used the same settings family, with llama.cpp on flash attention, default prefill batches, no speculative decoding and 16-bit KV. It is a vendor benchmark on two machines, not a guarantee for yours, and independent users have measured MLX faster on an M5 Max (175 vs 161 tok/s) and llama.cpp 20-30% faster on a 5070 Ti."
      }
    },
    {
      "@type": "Question",
      "name": "Does Magnitude replace Ollama or LM Studio?",
      "acceptedAnswer": {
        "@type": "Answer",
        "text": "They solve overlapping but different problems. Ollama and LM Studio run whatever model tag you name; Magnitude decides which model, quantization and context size your machine should run by assessing it first, then tunes kernels and speculation for that configuration and wires itself into your agent harness. Magnitude also normalizes reasoning formats, tool-call formats and chat templates so a harness can switch models without model-specific code. If you want the simplest way to run a model you already picked, Ollama is still the smaller tool; if you want a metadata-derived recommendation plus agent-shaped serving, that is Magnitude's job."
      }
    },
    {
      "@type": "Question",
      "name": "What hardware do I need, and what does it not support?",
      "acceptedAnswer": {
        "@type": "Answer",
        "text": "Magnitude supports Apple Silicon Macs on macOS 15 or newer (Metal), NVIDIA GPUs from Ampere (compute capability 8.0) with driver R525 or newer, Vulkan 1.3 devices on Windows and Linux, and CPU-only fallback on x86-64-v2 or AArch64 with glibc 2.35 on Linux. Intel Macs run CPU only. Out of scope as of October 2026: phones and mobile GPUs, older CUDA cards, and multi-GPU systems - the team confirmed multi-GPU is near-term roadmap, and open issues #142, #148, #151, #154 and #160 document hardware detection and model-load failures on hybrid iGPU/dGPU machines and some CPU-only systems."
      }
    },
    {
      "@type": "Question",
      "name": "Is Magnitude still open source if the company plans an inference cloud?",
      "acceptedAnswer": {
        "@type": "Answer",
        "text": "The engine, catalog and client code are Apache-2.0 today with no paid tier or license-gated features, and model weights carry their own separate licenses. The founders have said they plan to charge per token for a hybrid inference cloud that passes on the same efficiency gains, and that switching between local and cloud workloads should not break a prefix cache. That plan does not currently gate anything locally - everything runs offline after a model is downloaded - but it is the stated direction, so treat \"free forever\" as a plan rather than a contract."
      }
    }
