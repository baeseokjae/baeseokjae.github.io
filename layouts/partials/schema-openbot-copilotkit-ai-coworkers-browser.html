      "name": "What Is CopilotKit OpenBot?",
      "acceptedAnswer": {
        "@type": "Answer",
        "text": "OpenBot is the open-source, self-hosted half of CopilotKit's enterprise agent platform. The repository was created on 17 August 2026, announced publicly on 19 August, and is written mostly in TypeScript (roughly 83%) with about 12.8% Rust. CopilotKit raised a $27M Series A in May 2026 led by Glilot Capital, NFX and SignalFire, and OpenBot is the layer that lets a company run governed AI coworkers inside its own infrastructure instead of renting a hosted one."
      }

    {
      "@type": "Question",
      "name": "Is CopilotKit OpenBot free for commercial use?",
      "acceptedAnswer": {
        "@type": "Answer",
        "text": "Yes. The repository is MIT-licensed, and no enterprise tier gates the audit log, SSO or SAML/OIDC support. But the MIT licence covers the code, not the whole stack: durable threads and memory go through CopilotKit Intelligence, which is a separate, separately licensed service with a free plan and a self-hosted option. You also supply Docker, Bun 1.3+, a model key, and an operator."
      }
    },
    {
      "@type": "Question",
      "name": "Does OpenBot require CopilotKit Intelligence?",
      "acceptedAnswer": {
        "@type": "Answer",
        "text": "For durable threads and memory, yes — there is no degraded mode if it is unavailable. It sits outside the repository, is licensed separately, and offers both a free plan and a self-hostable option. It also provides the realtime gateway. Plan for it as a production dependency rather than an optional add-on."
      }
    },
    {
      "@type": "Question",
      "name": "Do I have to turn off OPENBOT_SINGLE_USER to deploy OpenBot safely?",
      "acceptedAnswer": {
        "@type": "Answer",
        "text": "Not quite — and this is where most coverage gets it wrong. `OPENBOT_SINGLE_USER=true` is required when no identity provider is configured, because a deployment that says nothing about how people sign in refuses to start. What protects you is that OpenBot refuses to start at all on a public address with that flag set. On a private address it starts with a single boot-time warning, and anyone who can reach that network is the administrator. The real fix is configuring Google, Microsoft Entra or Okta sign-in with `INITIAL_ADMIN_EMAILS`, not flipping the flag."
      }
    },
    {
      "@type": "Question",
      "name": "Can OpenBot coworkers handle 2FA or a login wall?",
      "acceptedAnswer": {
        "@type": "Answer",
        "text": "No, by design. A bot that hits a login wall or a 2FA prompt asks for help; a person takes the wheel in the same panel, signs in, and hands it back. The browser profile persists, so later runs stay signed in. Handovers are recorded as `computer.help_requested`, `computer.control_taken` and `computer.control_released`, and while a person is driving, bot actions are refused rather than queued. Since v0.0.5 a person can seize control at any time without waiting to be asked."
