      "acceptedAnswer": {
        "@type": "Answer",
        "text": "Yes. All models run on CPU with automatic fallback. A 7B model runs at 5–15 tokens/second on a modern CPU — usable for development and batch processing, though slower than GPU. Apple Silicon Macs are a special case: the M-series chips use unified memory for both CPU and GPU, achieving 30–60 tokens/second on 7B models without a discrete GPU."

      "name": "How do I use Ollama with LangChain?",
      "acceptedAnswer": {
        "@type": "Answer",
        "text": "Install langchain-ollama and use ChatOllama and OllamaEmbeddings: from langchain_ollama import ChatOllama, OllamaEmbeddings. Initialize with llm = ChatOllama(model='llama3.2', temperature=0) and embeddings = OllamaEmbeddings(model='nomic-embed-text'). This plugs directly into any LangChain chain, agent, or retriever."
      }
    },
    {
      "@type": "Question",
      "name": "What's the difference between /api/generate and /api/chat?",
      "acceptedAnswer": {
        "@type": "Answer",
        "text": "/api/generate takes a single prompt string and is stateless — the model sees exactly what you send. /api/chat takes a messages array (system/user/assistant roles) and is designed for multi-turn conversations. Under the hood, /api/chat formats the messages into the model's chat template automatically. Use /api/chat for conversational interfaces and /api/generate for completion tasks where you want full control over the prompt."
      }
    },
    {
      "@type": "Question",
      "name": "Can I run multiple models at the same time?",
      "acceptedAnswer": {
        "@type": "Answer",
        "text": "Yes, with OLLAMA_MAX_LOADED_MODELS set to 2 or higher. Each loaded model occupies VRAM independently. The practical limit is VRAM: two 7B Q4_K_M models need approximately 9GB VRAM total."
      }
    },
    {
      "@type": "Question",
      "name": "How do I add a custom system prompt permanently?",
      "acceptedAnswer": {
        "@type": "Answer",
        "text": "Create a Modelfile with FROM llama3.2 and SYSTEM directives, then run: ollama create my-custom-model -f Modelfile. The new model appears in /api/tags and accepts API calls like any other model. You can also set PARAMETER temperature and other defaults in the Modelfile."
      }
    }
