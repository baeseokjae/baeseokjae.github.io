      "name": "Can ASSERT evaluate tool-calling agents?",
      "acceptedAnswer": {
        "@type": "Answer",
        "text": "ASSERT can evaluate tool-calling agents when the execution path exposes enough evidence, especially through wrappers or traces. Useful checks verify whether the agent called the right tool, avoided forbidden tools, passed scoped parameters, handled errors correctly, and respected escalation requirements."
      }

    {
      "@type": "Question",
      "name": "Should ASSERT tests be generated automatically?",
      "acceptedAnswer": {
        "@type": "Answer",
        "text": "ASSERT can help generate tests from written requirements, but generated tests should be reviewed before they become release gates. Human review is needed to catch vague policies, unrealistic scenarios, weak judge criteria, and missing edge cases."
      }
    },
    {
      "@type": "Question",
      "name": "What is the fastest useful way to start with ASSERT?",
      "acceptedAnswer": {
        "@type": "Answer",
        "text": "The fastest useful start is one high-risk policy with clear user impact. Choose a data-access, refund, payment, deletion, or escalation rule; write positive and negative scenarios; run them against the real agent path; inspect traces; and save failures as regression cases."
