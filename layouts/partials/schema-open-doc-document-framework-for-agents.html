    {
      "@type": "Question",
      "name": "What is open-doc in one paragraph?",
      "acceptedAnswer": {
        "@type": "Answer",
        "text": "An MIT-licensed React-first document framework (`@open-document/core`) where a coding agent writes each report as React components while the framework supplies real A4/JIS B4/A3 page geometry, a self-filling contents page, running page numbers, DOM-measured auto-pagination, layout diagnostics and PDF/HTML/PNG/SVG export. Scaffold it with `npx @open-document/cli init my-docs`, then `open-doc dev` for the studio on port 5273."
      }
    },
    {
      "@type": "Question",
      "name": "Can it run headless in CI, and how does that work?",
      "acceptedAnswer": {
        "@type": "Answer",
        "text": "Yes. `open-doc check` renders every page at true size, reports clipped content, blank sheets, stranded headings, too-small type and failed images with source `line:column` locations, and exits non-zero — so the same command that advises an agent can fail a build. Headless export additionally needs `playwright` with chromium, an optional peer dependency rather than a bundled browser. See our notes on [code-mode MCP tooling](/posts/agent-codemode-mcp-scripts-2026/) for how agents typically consume tool surfaces like this."
      }
    },
    {
      "@type": "Question",
      "name": "Does it export to Word (.docx)?",
      "acceptedAnswer": {
        "@type": "Answer",
        "text": "No. Output is PDF, HTML, per-page PNG and SVG. Issue #35 requests `.docx` specifically because organisations that review in Word need track changes and comments. Until that lands a PDF is the end of the line; use Pandoc if Word is a hard requirement."
      }
    },
    {
      "@type": "Question",
      "name": "Which agents can drive it, and does it need a browser?",
      "acceptedAnswer": {
        "@type": "Answer",
        "text": "Anything that writes files or speaks MCP. Skills ship inside the scaffolder (`/create-doc`, `/doc-authoring`, `/current-doc`, `/apply-comments`, `/create-theme`) for agents that read skill directories, and `open-doc dev --mcp` mounts 23 tools at `http://localhost:5273/mcp` for any MCP client. A browser is required — deliberately, since PDF export uses the browser print pipeline at true page size so that what you see is what prints. Those skills follow the pattern covered in the [agent skills marketplace guide](/posts/agent-skills-marketplace-guide-2026-claude-codex-cursor-and-gemini-cli/)."
      }
    },
    {
      "@type": "Question",
      "name": "How mature is it, and is the MCP endpoint safe to expose?",
      "acceptedAnswer": {
        "@type": "Answer",
        "text": "Very early: created 2026-08-17, 78 stars, 7 forks, one human contributor, roughly 487 npm downloads a month for core, and a decay from 459 downloads in launch week to 23 in the last full week. On safety, no — not as shipped. The endpoint validates `Host` and `Origin` against loopback (403 on both) to block DNS rebinding and authenticates nothing, so anything beyond loopback needs an authenticating reverse proxy, and issue #34 means the intended `allowedHosts` escape hatch returns 403 anyway."
      }
