        "text": "Cove Sensory MCP is a Model Context Protocol server that deliberately limits itself to a single job: giving text-only language models the ability to perceive media files. The concept comes from Anthropic's Model Context Protocol, a universal open standard that lets AI applications connect to external tools and context. Instead of trying to build chat, memory, personality, playback, monitoring, or call policies, Cove's creators carved out one focused capability—sensing—and made it reusable across agents."
