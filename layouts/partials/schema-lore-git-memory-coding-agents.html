        "@type": "Answer",
        "text": "Lore reads history that Claude Code and Codex already persist on disk. You connect these in the app's settings: The important property is read-only: Lore does not install wrappers, intercept commands, or modify agent behavior. It takes what the agents already wrote and indexes it. That means there is no vendor lock-in — if you stop using Lore, your agent history is untouched, and if you stop using one agent, Lore still reads the other. It is also why onboarding is just a path selection rather than an invasive setup."
