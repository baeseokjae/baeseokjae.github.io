      "name": "What is an AI agent identity framework?",
      "acceptedAnswer": {
        "@type": "Answer",
        "text": "An AI agent identity framework is a security model that gives each agent its own identity, scoped authority, runtime boundary, model access controls, and audit trail. The goal is to stop treating agents like scripts with API keys and start treating them like managed non-human identities."
      }
    },
    {
      "@type": "Question",
      "name": "How is Teleport's Agentic Identity Framework different from normal IAM?",
      "acceptedAnswer": {
        "@type": "Answer",
        "text": "Normal IAM usually governs users, service accounts, and workloads. Teleport's framework focuses on agents that receive dynamic instructions, delegate work, call tools, and access production infrastructure. It connects identity to task delegation, LLM traffic, runtime isolation, and infrastructure audit."
      }
    },
    {
      "@type": "Question",
      "name": "Is LLM Proxy the same as an LLM gateway?",
      "acceptedAnswer": {
        "@type": "Answer",
        "text": "Not exactly. A generic LLM gateway often handles routing, spend, provider abstraction, and prompt logging. Teleport's LLM Proxy is positioned as identity-aware enforcement tied to Beams, delegated authority, inference endpoints, and Teleport's audit log."
      }
    },
    {
      "@type": "Question",
      "name": "Do AI agents need isolated runtimes?",
      "acceptedAnswer": {
        "@type": "Answer",
        "text": "High-risk agents do. If an agent can reach production systems, sensitive data, or privileged tools, runtime isolation limits filesystem access, network reachability, credential exposure, and persistence after the task ends. For low-risk agents, the overhead may not be justified."
      }
    },
    {
      "@type": "Question",
      "name": "Should every agent have its own identity?",
      "acceptedAnswer": {
        "@type": "Answer",
        "text": "Yes for production use. Shared accounts make attribution weak and least privilege difficult. Per-agent identity lets teams apply scoped policy, short-lived credentials, delegated authority, and audit records that show exactly which agent acted under which task."
      }
    }
