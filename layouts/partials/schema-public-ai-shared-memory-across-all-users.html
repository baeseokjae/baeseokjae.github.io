      "@type": "Question",
      "name": "What is shared AI agent memory?",
      "acceptedAnswer": {
        "@type": "Answer",
        "text": "Shared AI agent memory is a memory store whose contents are retrievable across more than one user or agent, rather than being scoped to a single account. It is best understood as three tiers: a private per-user layer, an attributed shared layer where the origin of a fact is visible, and a de-attributed generalisation layer that carries aggregate patterns without identity. Most architectural failures come from collapsing the attributed and de-attributed tiers into a single pool."
      }
    },
    {
      "@type": "Question",
      "name": "Is sharing memory across all users safe?",
      "acceptedAnswer": {
        "@type": "Answer",
        "text": "Not with a raw shared pool. Under raw shared state, benign interactions alone produce cross-user contamination rates of 57-71% ([arXiv 2604.01350](https://arxiv.org/html/2604.01350v1)) — no attacker required. It becomes defensible when it is built as separate tiers with provenance on every record, scope-first retrieval, write-time screening on every retain operation, and per-risk release gates. The evidence says sharing is safe *conditionally*; it does not say it is safe by default."
      }
    },
    {
      "@type": "Question",
      "name": "How much does unintentional cross-user contamination actually cost?",
      "acceptedAnswer": {
        "@type": "Answer",
        "text": "It costs correctness rather than uptime, which is why it is under-budgeted. A locally valid rule — a date format, a rounding convention, a workflow choice — persists in shared state and gets reapplied as if it were generally valid. When shared state includes executable artifacts, write-time sanitization leaves substantial residual risk and the failure presents as a **silent wrong answer** rather than an error. Nothing pages, and the affected user has no way to know another user caused it."
      }
    },
    {
      "@type": "Question",
      "name": "What is OWASP ASI06 and does it apply to shared memory?",
      "acceptedAnswer": {
        "@type": "Answer",
        "text": "ASI06 is Memory and Context Poisoning in OWASP's 2026 Top 10 for Agentic Applications, and it explicitly names shared context as an attack surface. It is separate from prompt injection (LLM01) because its properties are different: persistence across sessions and restarts, temporal decoupling (planted today, triggered weeks later), and privileged-input writes (anything that can write memory can override instructions). Reported attack success rates run from 80% to over 99%, and standard prompt-injection controls do not catch it because LLM01's controls reset when the session ends."
      }

      "name": "How do you delete a user's data from a shared memory pool?",
      "acceptedAnswer": {
        "@type": "Answer",
        "text": "You cannot delete only the source row. Vector embeddings, graph nodes and consolidated summaries are each new copies of the personal data, so erasure has to cascade through every derived projection. You also have to test for revoked-memory reuse — a deleted memory reappearing in another user's context — which MemRiskBench treats as a first-class risk. The practical minimum is a cascade sweep, versioned shared entries that can be superseded, and audit logging of disclosure and deletion so you can answer who retrieved a fact before it was revoked."
