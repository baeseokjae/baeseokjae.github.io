      "@type": "Question",
      "name": "Are system prompts enough to enforce least privilege?",
      "acceptedAnswer": {
        "@type": "Answer",
        "text": "System prompts are not enough to enforce least privilege because prompts guide behavior but cannot reliably block a tool call, revoke a credential, or prevent access to a resource. Use prompts to describe expected behavior, then enforce permissions in the tool broker, policy engine, retrieval gateway, and identity layer."
      }
    },
    {
      "@type": "Question",
      "name": "Should an agent use the end user's token?",
      "acceptedAnswer": {
        "@type": "Answer",
        "text": "An agent should not directly reuse the end user's long-lived token because that makes logs confusing and can over-delegate privileges. Use a separate agent identity with delegated-user claims, task purpose, resource scope, and short expiration so authorization can consider both the agent and the human requester."
      }
    },
    {
      "@type": "Question",
      "name": "How do MCP servers fit into least privilege?",
      "acceptedAnswer": {
        "@type": "Answer",
        "text": "MCP servers should be treated as privileged tool surfaces, not harmless adapters. Expose only the tools an agent workflow needs, narrow every parameter schema, validate inputs on the server side, apply policy before execution, and avoid generic filesystem, shell, browser, or database tools unless they run in a tight sandbox."
      }
    },
    {
      "@type": "Question",
      "name": "What actions should always require approval?",
      "acceptedAnswer": {
        "@type": "Answer",
        "text": "Approval should be required for actions that are irreversible, externally visible, financially material, privilege-changing, destructive, or legally sensitive. Common examples include production deploys, payment movement, refunds above a threshold, user deletion, role changes, public posts, customer emails, bulk exports, and destructive database writes."
      }
    },
    {
      "@type": "Question",
      "name": "How often should agent permissions be reviewed?",
      "acceptedAnswer": {
        "@type": "Answer",
        "text": "Agent permissions should be reviewed continuously through logs and formally after every material workflow change. At minimum, review tool usage, denied calls, unused scopes, active grants, approval rates, retrieval sources, and credential issuance monthly for sensitive agents and after every new connector or tool is added."
      }
