      "@type": "Question",
      "name": "What Does \"Code as an Artifact\" Actually Mean?",
      "acceptedAnswer": {
        "@type": "Answer",
        "text": "For most of software history, code was the end product. You wrote it, reviewed it, shipped it, and it lived on as the canonical record of what your system does. Agentic LLMs have inverted that relationship. As one widely shared argument puts it, \"Agentic LLMs have changed what 'code' means — it used to be the end product of the software lifecycle, but now LLMs write code and the spec becomes the durable artifact.\""
      }
    },
    {
      "@type": "Question",
      "name": "The Provenance Problem: Who Changed This Line, AI or Human?",
      "acceptedAnswer": {
        "@type": "Answer",
        "text": "The most concrete new requirement is line-level attribution. Teams need to answer a simple question: \"Who changed this line, AI or human, and why?\" This is not just an audit nicety — it drives review priority, liability decisions, security triage, and debugging."
