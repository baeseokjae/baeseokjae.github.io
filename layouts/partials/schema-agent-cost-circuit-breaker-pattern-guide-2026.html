      "acceptedAnswer": {
        "@type": "Answer",
        "text": "A kill switch is a manual or time-based stop — it terminates an agent after a fixed duration or when a human hits a button. A circuit breaker is threshold-driven and automatic, responding to behavioral signals (loop detection, cost velocity, consecutive failures). Kill switches are a fallback; circuit breakers are primary prevention."

      "name": "How do I choose between provider-level, tool-level, and session-level breakers?",
      "acceptedAnswer": {
        "@type": "Answer",
        "text": "Start with session-level breakers (they're the FinOps safety net), then add tool-level breakers for high-risk tools (write operations, payment APIs, email send), then provider-level breakers if you're running at scale with multiple model endpoints."

    },

        "@type": "Answer",
        "text": "For read-side operations, a half-open auto-reset with canary testing is fine. For write-side operations (DB writes, email, payments), require human reset. The cost of a false-positive breaker trip is far lower than the cost of a false-negative loop that writes duplicate data or charges customers twice."
