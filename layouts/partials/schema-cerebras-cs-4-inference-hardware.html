      "@type": "Question",
      "name": "Is the Cerebras CS-4 actually faster than GPUs?",
      "acceptedAnswer": {
        "@type": "Answer",
        "text": "Yes, on decode-dominated workloads. Artificial Analysis measured 4,400 tokens per second per user on gpt-oss-120B against about 350 tok/s on the fastest GPU-based inference service, which is roughly 12.6x. Cerebras' own headline of \"up to 30x\" comes from an internal benchmark on the same model against an unnamed GPU configuration with no published test protocol. SemiAnalysis independently estimates 20-40x interactivity gains for most frontier deployments. The direction of the claim is not in dispute; the peak number is."
      }
    },
    {
      "@type": "Question",
      "name": "Does the Cerebras CS-4 use a new chip?",
      "acceptedAnswer": {
        "@type": "Answer",
        "text": "No. The die is the same WSE-3 introduced in 2024 — same 4 trillion transistors, 900,000 AI cores, 44GB of SRAM, TSMC 5nm process and 46,225 mm² of silicon. The \"Turbo\" designation comes from roughly doubling the clock from about 1.4GHz to about 2.8GHz, which was only possible because Cerebras moved power conversion from about 50mm to about 0.5mm from the wafer and folded direct liquid cooling into a new Wafer-Scale Backpack. The CS-4 is best understood as a rack-generation product wearing a silicon-generation name."
      }
    },
    {
      "@type": "Question",
      "name": "How much does a Cerebras CS-4 cost?",
      "acceptedAnswer": {
        "@type": "Answer",
        "text": "Cerebras has not disclosed the purchase price, the lease rate, or a cloud rate for dedicated CS-4 capacity, and no named customer has been announced. What is public is Cerebras Cloud pricing on gpt-oss-120B at $0.35 per million input tokens and $0.75 per million output tokens at about 1,641 tokens per second, versus roughly $0.20 per million combined for the same open weights on commodity GPU routes — a spread of about 5x on identical model weights."
      }
    },
    {
      "@type": "Question",
      "name": "What is disaggregated inference and why does the CS-4 need it?",
      "acceptedAnswer": {
        "@type": "Answer",
        "text": "The CS-4 performs decode only. A separate prefill engine processes the prompt, transfers state, and the CS-4 generates tokens at ultra-low latency — AMD Helios (production targeted Q4 2026) and AWS Trainium-powered Bedrock (targeted Q1 2027) are the named partners. This is efficient because prefill is compute-bound while decode is memory-bandwidth-bound, but it fixes your prefill-to-decode ratio at purchase and pushes the latency of very long prompts onto the partner hardware, where engineers report possible 90-second delays."
      }
    },
    {
      "@type": "Question",
      "name": "Is wafer-scale SRAM better than HBM for LLM inference?",
      "acceptedAnswer": {
        "@type": "Answer",
        "text": "For decode, yes — bandwidth matters more than capacity. Autoregressive generation is memory-bandwidth-bound, and the CS-4 keeps 43.2 PB/s of bandwidth per wafer on the same silicon as the compute, with no interposer or off-package hop to HBM. The catch is capacity: 44GB of SRAM cannot hold a frontier model in FP16, and that figure has not moved since WSE-2 in 2021, which is why models must be sharded across three wafers and why analysts expect the next generation to double SRAM to roughly 88GB before anything else changes."
