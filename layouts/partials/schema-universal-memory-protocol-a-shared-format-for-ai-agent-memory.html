      "@type": "Question",
      "name": "What Is a Universal Memory Protocol?",
      "acceptedAnswer": {
        "@type": "Answer",
        "text": "A universal memory protocol is essentially a shared contract for how AI agents represent, store, and exchange their memory. It is the difference between a **memory architecture** and a **memory format**. An architecture describes how an agent organizes memory internally — for example, the core, archival, and recall layers popularized by Letta. A format describes the interoperable schema that lets data travel between systems. A universal memory protocol focuses on the format: a common representation of memory records, their metadata, their relationships, and their access permissions, so that data is not locked to one runtime."
      }
