      "@type": "Question",
      "name": "What is AgentOps Studio?",
      "acceptedAnswer": {
        "@type": "Answer",
        "text": "AgentOps Studio is not a single product. The name covers at least three separate projects: a full-stack MIT-licensed operations console for human-in-the-loop agent workflows, a LangGraph-native multi-agent research workbench with HITL approval gates, and a hackathon trace-diagnosis app that converts a failed run into a structured root-cause report. A commercial platform called AgentOps.ai also occupies the keyword."
      }
    },
    {
      "@type": "Question",
      "name": "Is AgentOps Studio free to use?",
      "acceptedAnswer": {
        "@type": "Answer",
        "text": "The two open-source implementations are MIT licensed and free to self-host, and one of them runs with no LLM API key using synthetic rules and prompts, so evaluation costs nothing. The commercial AgentOps.ai platform has a free Basic tier capped at 5,000 events per month — and because an event is each tracked LLM call, tool call or action rather than each run, that cap is exhausted in days for a real agentic workload."
      }
    },
    {
      "@type": "Question",
      "name": "Is AgentOps Studio production-ready?",
      "acceptedAnswer": {
        "@type": "Answer",
        "text": "No. Both open-source repositories are reference implementations with small communities (7 and 108 GitHub stars). The HITL console's own documentation lists missing authentication, no role-based access control, a demo reviewer identity, synchronous execution without cancellation, and checkpoints that do not resume across the human review gate. Adopt the patterns; do not adopt the dependency."
      }
    },
    {
      "@type": "Question",
      "name": "How is an operations console different from an observability dashboard?",
      "acceptedAnswer": {
        "@type": "Answer",
        "text": "A dashboard answers what happened. A console changes what happens next: pause a workflow mid-run, approve or reject with recorded notes, retry a failed step, hot-reload policy without restarting agents, and export an audit record. The category's remaining weakness is that even consoles rarely issue a verdict on whether the current turn is acceptable — that gap is exactly where the evaluation layer is missing."
      }
    },
    {
      "@type": "Question",
      "name": "Should I self-host an agent operations console or buy a managed one?",
      "acceptedAnswer": {
        "@type": "Answer",
        "text": "Buy managed when you need broad framework coverage immediately and event metering is not a constraint. Self-host when data residency, volume, or an existing platform team makes metering untenable — but budget the real cost, since self-hosting a full observability stack means operating five services (FastAPI, Next.js, PostgreSQL or Supabase, ClickHouse, and an OTel Collector). If your missing layer is approvals and audit rather than traces, a lightweight MIT console or a self-built equivalent is the better fit."
      }
    }
