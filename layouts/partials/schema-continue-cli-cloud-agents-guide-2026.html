      "name": "Is Continue CLI free to use?",
      "acceptedAnswer": {
        "@type": "Answer",
        "text": "Yes. The `cn` CLI and Continue.dev platform are open source. You bring your own API key for whichever LLM you choose (Anthropic, OpenAI, Gemini, etc.) and pay that provider's standard rates. Mission Control has a hosted tier with usage limits; the self-hosted path is entirely free."

      "@type": "Question",
      "name": "Does Continue CLI work with local models (Ollama)?",
      "acceptedAnswer": {
        "@type": "Answer",
        "text": "Yes. Set `provider: ollama` and `model: llama3.2` (or any Ollama-supported model) in your `config.yaml`. Local models are useful for sensitive codebases where you don't want code leaving your network. The trade-off is speed and capability compared to frontier models."
      }
    },
    {
      "@type": "Question",
      "name": "How does Continue CLI handle large codebases with many files?",
      "acceptedAnswer": {
        "@type": "Answer",
        "text": "Continue CLI uses the same context management as the IDE extension \u2014 it retrieves relevant file snippets using embeddings rather than loading the entire codebase. For very large repos, the `--context` flag lets you specify which files or directories to scope to, preventing context window overflow."
      }
    },
    {
      "@type": "Question",
      "name": "Can I run Continue CLI in a Docker container for CI/CD?",
      "acceptedAnswer": {
        "@type": "Answer",
        "text": "Yes. Use the official Node.js base image, install `@continue/cn` via npm, inject your API keys as environment variables, and run `cn -p \"...\"` as a standard step. The CLI has no GUI dependencies and works in any headless Linux environment."
      }
    },
    {
      "@type": "Question",
      "name": "What's the difference between Continue CLI Alpha and the stable VS Code extension?",
      "acceptedAnswer": {
        "@type": "Answer",
        "text": "The VS Code extension (10M+ installs) is the stable, production-ready product used for interactive pair programming. The CLI (`cn`) is in Alpha \u2014 it has the same core capabilities but fewer polish features, less documentation, and the API may change before Beta. For production CI/CD use, pin to a specific version (`@continue/cn@x.y.z`) to avoid unexpected breaking changes."
      }
