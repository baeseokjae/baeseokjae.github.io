        "text": "It is a cost incident where an agent workflow runs on the wrong model because the model configuration is missing, misspelled, overridden, or silently defaulted. The agent can keep producing acceptable output while using a much more expensive model than intended."

      "name": "What is the difference between requested model and response model?",
      "acceptedAnswer": {
        "@type": "Answer",
        "text": "requested_model is what your application, router, or SDK asked for. response_model is what the provider says generated the response. They can differ because of fallback routing, aliases, gateway policy, provider defaults, regional endpoints, or missing config."
      }
