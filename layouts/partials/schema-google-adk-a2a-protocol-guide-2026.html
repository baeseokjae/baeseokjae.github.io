      "name": "Is Google ADK the same thing as the A2A protocol?",
      "acceptedAnswer": {
        "@type": "Answer",
        "text": "Google ADK is not the same thing as the A2A protocol; ADK is an agent development framework, while A2A is an interoperability protocol. Use ADK to define agent behavior, tools, state, workflows, and orchestration. Use A2A when that agent needs to advertise skills, accept remote tasks, stream progress, or return artifacts to another agent or orchestrator."
      }
    },
    {
      "@type": "Question",
      "name": "Do I need MCP if I already use A2A?",
      "acceptedAnswer": {
        "@type": "Answer",
        "text": "MCP is still useful with A2A because the two layers solve different problems. MCP connects an agent to tools, services, files, APIs, and context sources. A2A connects one autonomous agent to another autonomous agent. A common pattern is an ADK agent that uses MCP to read GitHub and uses A2A to delegate security review to a remote agent."
      }
    },
    {
      "@type": "Question",
      "name": "When should I not expose an ADK sub-agent through A2A?",
      "acceptedAnswer": {
        "@type": "Answer",
        "text": "You should not expose an ADK sub-agent through A2A when it is only an internal helper inside one application and has no independent ownership, deployment, or framework boundary. Local ADK composition is simpler and faster. Add A2A when another team, service, cloud, framework, or organization needs to call that capability through a stable contract."
      }
    },
    {
      "@type": "Question",
      "name": "What should an Agent Card include in a production system?",
      "acceptedAnswer": {
        "@type": "Answer",
        "text": "An Agent Card should include the agent's identity, endpoint, supported protocol version, authentication requirements, skill descriptions, input expectations, output or artifact formats, and operational ownership. In production, treat the card like an API contract. Keep skills narrow, version changes clearly, and store trusted cards in a governed registry instead of accepting arbitrary metadata."
      }
    },
    {
      "@type": "Question",
      "name": "Can A2A work across non-Google frameworks?",
      "acceptedAnswer": {
        "@type": "Answer",
        "text": "A2A can work across non-Google frameworks because its purpose is cross-framework agent interoperability. An ADK orchestrator can call agents implemented in Microsoft Agent Framework, LangGraph, BeeAI, custom services, or vendor platforms if those agents expose compatible A2A endpoints and trusted Agent Cards. The hard parts are authentication, versioning, observability, and artifact contracts, not the framework names."
      }
