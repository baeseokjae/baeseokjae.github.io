      "acceptedAnswer": {
        "@type": "Answer",
        "text": "Claude Code's context window fills up as your conversation grows. Run /compact to reduce context size, or /compact keep only the plan and the diff to strip everything except your active work. If memory usage is high, run /heapdump and inspect the heap snapshot in Chrome DevTools. For very large codebases, consider using sub-agents to parallelize work across smaller context windows."
