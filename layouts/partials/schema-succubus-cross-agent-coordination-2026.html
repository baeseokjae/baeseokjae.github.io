      "@type": "Question",
      "name": "What is Succubus?",
      "acceptedAnswer": {
        "@type": "Answer",
        "text": "Succubus is an open-source, single-binary daemon written in Go that coordinates multiple AI coding agents working on the same repository. It prevents the \"blind multi-agent\" problem — where two or more AI agents edit the same files without knowing about each other — by providing file claims with lease-based locking, a shared task board, inter-agent communication, and a real-time dashboard. Created by enowx labs and released on July 28, 2026, Succubus supports eight different AI coding tools including Claude Code, Codex CLI, Gemini CLI, Cursor CLI, and Aider, and integrates via both MCP server and mandatory lifecycle hooks."
      }
    },
    {
      "@type": "Question",
      "name": "The Problem — Why Do AI Coding Agents Need Coordination?",
      "acceptedAnswer": {
        "@type": "Answer",
        "text": "AI coding agents are becoming indispensable for software development. Developers routinely run multiple agents in parallel — one refactoring a backend module while another updates tests and a third writes documentation. The problem is that these agents operate in isolation. Each agent sees the repository as it was when it started, not as it is right now. When Agent A modifies `auth.go` and Agent B simultaneously rewrites the same function, the result is merge conflicts, lost work, and corrupted state."
      }
    },
    {
      "@type": "Question",
      "name": "Architecture Overview — How Does Succubus Work?",
      "acceptedAnswer": {
        "@type": "Answer",
        "text": "Succubus is a daemon process that runs on the developer's machine and exposes two integration surfaces: an MCP server for opt-in tool access, and lifecycle hooks for mandatory registration. The daemon uses an embedded SQLite database (via `modernc.org/sqlite`, its only non-stdlib dependency) to store agent identities, file claims, task board items, and agent room messages."
      }
    },
    {
      "@type": "Question",
      "name": "Key Features — What Can Succubus Do?",
      "acceptedAnswer": {
        "@type": "Answer",
        "text": "### Agent Identity and Registration Every agent that connects to Succubus receives a curated identity from a pool of 32 names — ORION, VESPER, KESTREL, NEXUS, and others. These identities persist across sessions via the local cache file, enabling the daemon to track agent history, heartbeat status, and claim ownership over time."
      }
    },
    {

      "name": "Tool Support and Integration — Which Agents Can Use Succubus?",

        "@type": "Answer",
        "text": "Succubus supports eight AI coding tools out of the box: ### MCP Server The MCP (Model Context Protocol) server exposes Succubus's coordination primitives as tools that agents can call. This is the opt-in integration path — agents that support MCP can discover and use Succubus's features without any custom configuration. The MCP server provides tools for claiming files, querying the task board, sending agent room messages, and checking agent status."
