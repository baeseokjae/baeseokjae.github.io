      "@type": "Question",
      "name": "What Is the Safari MCP Server?",
      "acceptedAnswer": {
        "@type": "Answer",
        "text": "The Safari MCP server is Apple's first-party implementation of the Model Context Protocol (MCP) inside Safari. MCP is Anthropic's open protocol for connecting AI agents to external tools, introduced in November 2024 and donated to the Linux Foundation's Agentic AI Foundation in December 2025. Instead of building a browser-specific HTTP API, Apple built the server directly into `safaridriver` — the W3C WebDriver binary that has shipped with Safari since version 10 on macOS Sierra in 2016 — and toggled it with a new `--mcp` flag."
      }
