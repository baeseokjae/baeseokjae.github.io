    {
      "@type": "Question",
      "name": "Is PhoneBuddySDK really pure Rust?",
      "acceptedAnswer": {
        "@type": "Answer",
        "text": "The core agent engine is. The repository's language breakdown on 2026-10-01 shows approximately 1.36 MB of Rust against 36 KB of C, with a small shell component. The C exists as a stable ABI boundary — the `phone_buddy.h` header — that the Swift and Kotlin wrappers bind to. The agent loop, file sandbox, virtual shell, JavaScript engine integration and subagent manager are all Rust. No child-process path exists in the core crates, which the independent audit confirmed statically."
      }
    },
    {
      "@type": "Question",
      "name": "Does it work on iOS given that iOS forbids spawning processes?",
      "acceptedAnswer": {
        "@type": "Answer",
        "text": "That constraint is the reason the SDK is built the way it is. Instead of shelling out, it re-implements each capability in Rust — file operations, a virtual BusyBox-style command set, a bounded JavaScript sandbox — and runs them in the host app's own process. The agent's reach is therefore bounded by the host app's own permissions. iOS compliance is an architectural premise of the project, not an afterthought, though no public App Store review record confirming an actual submission has been found."
      }
    },
    {
      "@type": "Question",
      "name": "Can the agent write to arbitrary files on the device?",
      "acceptedAnswer": {
        "@type": "Answer",
        "text": "No. The file tools operate inside a jailed workspace rooted at a configured `root_dir`, with path-traversal prevention applied to the operations. That is verified statically by the independent audit. The practical consequence is that the agent can manipulate files your app can already reach, and cannot reach anything your app does not already have permission to touch."
      }
    },
    {
      "@type": "Question",
      "name": "How does it compare to Napaxi?",
      "acceptedAnswer": {
        "@type": "Answer",
        "text": "Both are Rust mobile agent SDKs and they overlap on sessions, tools, workspace state and platform hooks. Napaxi is GPL-3.0 and takes an adapter-first approach with Flutter as the first complete target, plus an explicit MCP surface and cross-app connectivity through xApp, xAgent and xChannel. PhoneBuddySDK is Apache-2.0, uses a C ABI with first-class Swift and Kotlin wrappers, and does not advertise MCP. For closed-source commercial apps the license difference — permissive versus copyleft — is usually the deciding factor."
      }
    },
    {
      "@type": "Question",
      "name": "Does it run models locally, or does it need the cloud?",
      "acceptedAnswer": {
        "@type": "Answer",
        "text": "Both are supported. The default transport speaks three wire protocols (`responses` with SSE streaming, `chat_completions`, and `messages`) over HTTP/2 with `rustls-ring`, and can emulate first-party client profiles for Grok Build, Codex and Claude Code. Separately, `LlmMode::Host` delegates inference to an on-device model through `PbLlmRequestCallback`, targeting runtimes such as `llama.cpp` and `llama.rn` on NPU-class hardware. The on-device path is the one that keeps prompts and data on the phone, and it pairs naturally with on-device foundation models that expose tool-calling APIs."
      }
    }
