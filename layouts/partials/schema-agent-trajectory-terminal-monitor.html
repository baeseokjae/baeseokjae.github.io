      "name": "What is an agent trajectory monitor?",
      "acceptedAnswer": {
        "@type": "Answer",
        "text": "An agent trajectory monitor observes the sequence and relationships between an agent's spans — tool calls, file edits, shell commands, subagent calls — rather than the latency of any single call. It answers whether the run is still converging on the authorized goal. Monte Carlo frames it commercially as alerting on span occurrence and relationship patterns; AgentPulse implements it locally by labeling a session converging, exploring, stuck, done, drifting or idle without any model call."
      }
    },
    {
      "@type": "Question",
      "name": "Do I need OTel instrumentation to monitor coding agents?",
      "acceptedAnswer": {
        "@type": "Answer",
        "text": "No, but it is now the cleanest path. Claude Code 1.0 (GA 2026-06-26) emits native hook spans with gen_ai.* attributes on PreToolUse, PostToolUse, SubagentStart and SubagentStop, opt-in via OTEL_EXPORTER_OTLP_ENDPOINT, with tool output truncated to 8 KB. Agents without hooks can be monitored by reading local JSONL transcripts — that is how AgentPulse works. The catch is attribute drift: Gemini CLI and Codex CLI emit OpenInference names, so you need a collector rename processor before they share one timeline."
      }
    },
    {
      "@type": "Question",
      "name": "Is deterministic agent drift detection accurate enough to gate CI?",
      "acceptedAnswer": {
        "@type": "Answer",
        "text": "It is reliable within its vocabulary and explicitly incomplete outside it. AgentPulse's drifting state covers privileged paths (.ssh, .aws, .kube, /etc/shadow), a curl or wget piped into sh/bash/zsh, and a Write or Edit outside the repo root — and documents that it does not cover process substitution, download-then-execute chains, package install hooks, or symlink escapes. Use it as a high-signal gate for known-bad patterns, not as a security boundary, and keep the unaddressed cases visible rather than assumed-passed."
      }
    },
    {
      "@type": "Question",
      "name": "How is a trajectory monitor different from an agent observability dashboard?",
      "acceptedAnswer": {
        "@type": "Answer",
        "text": "A dashboard tells you what happened across calls; a trajectory monitor issues a per-session judgment. Per-action controls answer \"is this one operation allowed now,\" while trajectory monitoring answers \"given everything already attempted, what is this run trying to accomplish now.\" That distinction matters because per-call views structurally cannot show a wrong tool name used three times before a hallucinated stack trace, a 4,200-token edit on a three-line file, or a failing command silently retried seven times."
      }
    },
