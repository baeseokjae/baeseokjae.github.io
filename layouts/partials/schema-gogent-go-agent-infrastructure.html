    {
      "@type": "Question",
      "name": "Does gogent support MCP servers, and does it sandbox tool execution?",
      "acceptedAnswer": {
        "@type": "Answer",
        "text": "Yes to both, and it is the strongest part of the project. MCP servers connect over stdio (`process` driver) or streamable HTTP, expand into `server.tool` sub-tools, and are Ping-probed every 30 seconds with automatic restart after three consecutive failures. Tool execution runs daemon-side through Auth → Hook:pre → Sandbox → Hook:post → Result, with sandbox routing resolved per-tool, then app default, then daemon default, across E2B MicroVM, `bwrap` and Kubernetes backends."
      }
    },
    {
      "@type": "Question",
      "name": "gogent vs LangGraph: which should a Go team pick?",
      "acceptedAnswer": {
        "@type": "Answer",
        "text": "They operate at different layers, so the question is usually a category error. LangGraph is a library for expressing agent logic as state graphs — nodes, edges, checkpoints — inside your process. gogent is a harness for running agent applications: YAML component assembly, a daemon with OS-subprocess isolation, centralized tool authorization, sandboxed execution and OTel export. A Go team that wants graph semantics should look at tRPC-Agent-Go, which is explicitly positioned as \"LangGraph in Go.\" A team that wants the operations layer should study gogent, with the caveat above about maturity."
      }
    },
    {
      "@type": "Question",
      "name": "Should I choose gogent over Eino or Google ADK Go?",
      "acceptedAnswer": {
        "@type": "Answer",
        "text": "Not for a production feature today. Eino (13,219 stars, Apache-2.0, production-hardened at ByteDance) and Google's ADK for Go (8,837 stars, first-party agents, workflows, A2A and MCP toolsets) both have orders of magnitude more adoption, provider breadth, tooling and support. Choose gogent only if your specific requirement is daemon-managed multi-application process isolation with least-privilege tool manifests on a single machine — and treat it as a self-supported pre-1.0 dependency with one author."
