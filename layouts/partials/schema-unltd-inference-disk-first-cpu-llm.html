      "name": "What is unltd inference written in Rust?",
      "acceptedAnswer": {
        "@type": "Answer",
        "text": "UNLTD Inference (`unltdev/unltd-inference`) is an Apache-2.0 Rust workspace of eight crates for CPU-only GGUF inference, with MSRV Rust 1.80, edition 2021 and a minimal dependency set including `memmap2`, `half`, `bytemuck`, `clap` and `rayon`. It is a from-scratch inference core rather than a wrapper over Candle or llama.cpp bindings."
      }
    },
    {
      "@type": "Question",
      "name": "Can unltd-inference really run a model larger than its memory budget?",
      "acceptedAnswer": {
        "@type": "Answer",
        "text": "Yes, and this is the project's central validated claim - but the budget governs runtime-controlled memory only. In the validated v1.0.0 run, a 5.63 GB model executed under a 3-4 GB budget with about 113.19 MB of controlled runtime memory (minimum viable budget 113.06 MB), while peak process working set still reached roughly 5.24 GB because the mapped model file counts toward RSS. The weights contribute zero bytes to the controlled budget because they are memory-mapped views, never heap copies."
      }
    },
    {
      "@type": "Question",
      "name": "How is unltd-inference different from llama.cpp?",
      "acceptedAnswer": {
        "@type": "Answer",
        "text": "Not through speed or coverage. llama.cpp has roughly 130,000 stars, 146 registered GGUF architectures and mmap enabled by default, which already lets an oversized model run on a small machine. unltd-inference's differentiators are explicit pre-validated memory accounting (it prints `REFUSING TO RUN` and exits 2 rather than failing at runtime), a published oracle-comparison workflow against llama.cpp, and a determinism-across-memory-budgets measurement protocol. It is slower, narrower and far less mature."
      }
    },
    {
      "@type": "Question",
      "name": "What are unltd-inference's biggest limitations in v1.0.0?",
      "acceptedAnswer": {
        "@type": "Answer",
        "text": "Scalar-only kernels with no SIMD or AVX2, no multithreading, greedy decoding only (temperature zero), no MoE execution, no layer or expert streaming or prefetching, no GPU path, and Windows x86-64 as the only end-to-end validated platform - Linux is explicitly not validated. Generation also diverges from the llama.cpp oracle after about eleven greedy steps, which the project documents openly as an argmax near-tie flip caused by scalar-versus-AVX2 numeric accumulation."
      }
    },
    {
      "@type": "Question",
      "name": "Should I use unltd-inference for local LLM inference?",
      "acceptedAnswer": {
        "@type": "Answer",
        "text": "Not for interactive work. Published throughput is roughly 73 seconds of prefill and about 14.3 seconds per token (~0.07 tok/s), which is two orders of magnitude off a resident model of the same size and makes it usable only as a batch or research workload. Its real value is as a correctness-first reference implementation you can study, plus a reusable measurement protocol for memory-constrained benchmarking. For actual daily local inference, a resident 9B quantized model on llama.cpp or Ollama remains the practical choice - see our guide to [the best local LLM models](/posts/best-local-llm-models-2026/) for current options."
      }
    }
