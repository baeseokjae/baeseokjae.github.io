      "name": "What Is a Walking-Dead State, Exactly?",
      "acceptedAnswer": {
        "@type": "Answer",
        "text": "The term is design criticism, not engineering vocabulary, and it starts with the player rather than the code. Jimmy Maher's *The 14 Deadly Sins of Graphic Adventure Design* named the **walking-dead syndrome**: the human continues playing a game that has, unbeknownst to them, been rendered unwinnable. His worked example is *Uninvited* (1986). Walk past the mailbox in the Front Yard without looking inside it, step through the front door, and the door locks behind you forever. The mailbox held an item you now cannot get. As Maher puts it, \"as soon as you go inside, you become a walking dead.\""

      "@type": "Question",
      "name": "What is a walking dead state in a game?",
      "acceptedAnswer": {
        "@type": "Answer",
        "text": "A walking dead state is a situation where the player keeps playing a game that has, without their knowledge, become unwinnable. The term comes from adventure-game design criticism — Jimmy Maher's \"walking-dead syndrome\" — and describes the player's situation rather than the code. The mechanical condition that causes it is called a softlock: the FDG 2025 literature defines that as a state where the player has not won or lost, but cannot make progress toward the goal. The game keeps running and keeps accepting input in both cases, which is precisely why neither shows up in crash telemetry."

    {
      "@type": "Question",
      "name": "Is a walking dead state the same as a softlock?",
      "acceptedAnswer": {
        "@type": "Answer",
        "text": "No, and the distinction is useful. A softlock is a property of the game state — a reachable configuration from which the goal is unreachable. A walking dead state is a property of the player's session — a human who has not yet realized they are in that configuration and keeps playing. One softlock can produce many walking-dead states, because the player may wander for hours before giving up. Tooling that only detects the mechanical condition is still correct; tooling that only tracks player behavior is not, because most players in a walking-dead state never report anything at all."
