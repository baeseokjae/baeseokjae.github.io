      "name": "Why Does a Forer (Barnum) Statement Feel Written for You?",
      "acceptedAnswer": {
        "@type": "Answer",
        "text": "Because the effect has been producing that feeling on purpose since 1949, and its conditions are known. Bertram Forer's classroom demonstration gave every student an identical personality sketch, assembled from a newsstand astrology book, and asked them to rate its accuracy. The average rating is commonly cited as roughly 4.3 out of 5 — sources disagree between 4.26 and 4.30, so treat the exact decimal as approximate, with 13 statements and the astrology-book provenance consistent across every source. Crucially, the original design also asked students to rate each of the 13 statements individually, distinguishing whole-profile acceptance from per-statement scrutiny. Forer named the phenomenon the \"fallacy of personal validation\"; Paul E. Meehl coined \"Barnum effect\" in his 1956 essay \"Wanted — A Good Cookbook.\""
      }
    },
