      "name": "What is a walking-dead state in an AI agent?",
      "acceptedAnswer": {
        "@type": "Answer",
        "text": "A walking-dead agent is a process that is technically running but semantically stuck. It differs from a crash: a crash is visible and easy to detect, while a walking-dead state hides behind a green \"alive\" status. The process exists, the port responds, CPU and memory look normal, and no error is logged—yet the work has stopped moving."
