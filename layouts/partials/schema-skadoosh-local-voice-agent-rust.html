      "@type": "Question",
      "name": "Does Skadoosh need a GPU?",
      "acceptedAnswer": {
        "@type": "Answer",
        "text": "No — the default path is CPU-only. The bundled LLM is a 4-bit Qwen2.5-1.5B GGUF running through Ollama, and Kokoro-82M with `ort` runs on CPU. That said, GPU acceleration matters for the user experience: Kokoro reaches roughly RTF 0.03 on GPU (a 10-second clip in about 0.3 seconds) versus 0.57 on four x86 cores and below 1x on two ARM cores. CUDA, CoreML, DirectML, and ROCm features exist, but on a two-core ARM machine text-to-speech will not keep up with playback."
      }
    },
    {
      "@type": "Question",
      "name": "Which languages does it support?",
      "acceptedAnswer": {
        "@type": "Answer",
        "text": "The crate is language-agnostic, but every default is English-first: whisper `tiny.en` for recognition and Kokoro's `af` voice for synthesis. Changing recognition language means supplying a different Whisper model file, and changing synthesis language means a Kokoro voice key plus working phonemisation through misaki-rs. There is no built-in multilingual routing, and nothing in the project addresses non-English latency."
      }
    },
    {
      "@type": "Question",
      "name": "Does it run on a Raspberry Pi or ARM?",
      "acceptedAnswer": {
        "@type": "Answer",
        "text": "It builds and runs, but the TTS stage is the limiting factor. On two Neoverse-N1 ARM cores Kokoro-82M measures 0.87-0.93x real time — slower than it speaks — while Piper holds 8.2x on the same machine. If you are targeting Pi-class hardware, swapping the synthesizer is mandatory rather than optional. Silero VAD and Whisper `tiny.en` are both comfortable on that class of hardware."
      }
    },
    {
      "@type": "Question",
      "name": "Can I point it at a hosted LLM instead of Ollama?",
      "acceptedAnswer": {
        "@type": "Answer",
        "text": "Yes. The LLM stage is the `LlmBackend` trait, backed by a streaming OpenAI-compatible chat client, so any compatible endpoint works. Be aware of what that changes: routing the LLM to a hosted provider removes the \"no data leaves the machine\" guarantee that is the main compliance argument for using Skadoosh, since the transcript and the model's reply leave your network even though the audio does not."
      }
    },
