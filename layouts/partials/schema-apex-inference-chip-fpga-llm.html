    {
      "@type": "Question",
      "name": "What is the Apex Inference Chip, and is it a real chip?",
      "acceptedAnswer": {
        "@type": "Answer",
        "text": "It is not a chip. APEX (also called tinyNPU) is an open-source Apache-2.0 RTL design from SigmanticAI implementing a single transformer decoder layer as a reusable tile. By explicit charter it has no DRAM controller, no PCIe block and no network-on-chip, so it cannot be dropped into a system as a standalone accelerator. It has been built and run on two real targets — a Lattice ECP5-85F using the open yosys/nextpnr flow, and an AWS F2 VU47P instance using Vivado — which makes it more than a simulation-only design, but less than a product."
      }
    },
    {
      "@type": "Question",
      "name": "How fast is FPGA LLM inference on APEX?",
      "acceptedAnswer": {
        "@type": "Answer",
        "text": "0.56 tokens per second on the fastest measured image (A0 at 62.5 MHz, a steady 1.78 seconds per token on Qwen2.5-0.5B) and 0.25 tok/s on the reference image at 15.625 MHz. The full optimization ladder climbed 140x from a 0.004 tok/s host-driven baseline. Only 8.53% of per-token arithmetic happens inside the tile; the rest of the wall is host transport, at 24 executor invocations per token of roughly half a second each. The tile's own walk window is about 36 ms."
      }
    },
    {
      "@type": "Question",
      "name": "Has the 7B model actually run on the APEX FPGA?",
      "acceptedAnswer": {
        "@type": "Answer",
        "text": "No. Qwen2.5-0.5B is the FPGA-measured model. Qwen2.5-7B has run only through the software-verified golden pipeline and has never executed on silicon. The much-quoted 7B figures — reading-speed generation at roughly 3 W with 32k–64k context held flat by KV compression, and 5–10x lower energy per token than a desktop GPU — are projected from a calibrated analytic model and depend on three unbuilt pieces: the native-W4 weight path, the hardware layer walker, and a wide LPDDR interface."
      }
    },
    {
      "@type": "Question",
      "name": "What makes APEX different from other FPGA LLM projects?",
      "acceptedAnswer": {
        "@type": "Answer",
        "text": "Verification discipline, not throughput. The verification surface is roughly twice the RTL surface — 27,760 lines of SystemVerilog testbenches plus 21,043 lines of Python against about 22,000 lines of RTL. Testbenches are mutation-tested so a surviving mutant fails the build; SiLU is checked over 65,536 patterns bit-exact; the W4B feeder runs a 4,063,104-point operand sweep; and a full-layer replay passed 28 cases across 152,883 checks. The KV codec method itself is prior art from KIVI and KVQuant, and hardware KV compression predates it in Titanus and Kelle — the claim is the integrated, verified implementation."
      }
    },
    {
      "@type": "Question",
      "name": "Can I reproduce the Apex Inference Chip results myself?",
      "acceptedAnswer": {
        "@type": "Answer",
        "text": "Yes, at three levels of cost. `make -C golden test` validates the NumPy golden model locally for free. The pre-built AWS F2 reference image (`agfi-030a812cd224b409d`) rebuilds the full design in about $2 and 30 minutes on an f2.6xlarge, with the repository reporting a 193-check battery at zero failures. The KV codec accuracy matrix on HellaSwag is the third check. Note that this review did not independently rebuild the bitstream — the cost and timing figures are the project's own, taken from the committed README and status files rather than reproduced here."
