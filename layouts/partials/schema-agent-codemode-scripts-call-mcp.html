    {
      "@type": "Question",
      "name": "What does \"agent codemode MCP\" actually mean?",
      "acceptedAnswer": {
        "@type": "Answer",
        "text": "It means letting the code your coding agent writes call MCP servers directly, instead of routing every call through the model's native tool-calling loop. The agent produces a script; the script makes the calls and returns one filtered result to the model. The token win comes from removing intermediate results from context and loading tool definitions on demand rather than upfront."
      }
    },
    {
      "@type": "Question",
      "name": "Do I need to set up API keys or an OAuth flow?",
      "acceptedAnswer": {
        "@type": "Answer",
        "text": "Not with `agent-codemode`. It reads the OAuth token your coding agent already minted — the macOS Keychain entry `Claude Code-credentials`, or `~/.claude/.credentials.json` on Linux — and speaks JSON-RPC to the MCP server itself. There is no separate `.env`, no vault, and no `auth` step. Servers configured with API keys or stdio still work; only the OAuth inheritance is Claude-specific today."
      }
    },
    {
      "@type": "Question",
      "name": "How much context does code mode actually save?",
      "acceptedAnswer": {
        "@type": "Answer",
        "text": "Cloudflare reports roughly 1,000 tokens for two tools covering about 2,500 API endpoints, versus 1,170,523 tokens for an equivalent native MCP server (−99.9%). Anthropic measured 150,000 tokens reduced to 2,000 (−98.7%). A live 40-call Linear workspace measured 262,159 characters reduced to 903 (−99.66%, 290×). Your own numbers will differ — measure call count, characters, re-reads, and wall clock rather than trusting the headline."
      }
    },
    {
      "@type": "Question",
      "name": "Is it safe to execute code the model wrote?",
      "acceptedAnswer": {
        "@type": "Answer",
        "text": "It moves the trust boundary, so the sandbox becomes the security control. Check Point found five memory-corruption bugs in `workerd` (two Critical), including a Code Mode sandbox escape reachable from a single prompt injection; self-hosted deployments should update to `v1.20260619.1`. Run generated code in an isolate with no network egress and no environment variables, pass tools rather than credentials into the execution context, and keep the runner patched."
      }
    },
    {
      "@type": "Question",
      "name": "When should I skip code mode entirely?",
      "acceptedAnswer": {
        "@type": "Answer",
        "text": "Skip it for three or four chained calls, fewer than ten tools, or any client without a shell. If you want token savings without executing model-written code, dynamic tool discovery is a credible alternative — Speakeasy reports up to 160× reduction with no code execution. Code mode pays off at bulk fan-out: past roughly ten calls, or when the same job should run on a schedule with no model in the loop at all."
      }
    }
