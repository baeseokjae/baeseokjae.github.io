    {
      "@type": "Question",
      "name": "Is Mojo fully open source now?",
      "acceptedAnswer": {
        "@type": "Answer",
        "text": "The Mojo compiler and toolchain are fully open source under Apache 2.0 with LLVM Exceptions as of August 18, 2026. The broader Modular platform is not: MAX, the inference engine and serving layer, remains source-available under the Modular Community License. \"Mojo is open source\" is a true claim about the language and a false one about the platform."
      }
    },
    {
      "@type": "Question",
      "name": "Can I fork the Mojo compiler and ship my own version?",
      "acceptedAnswer": {
        "@type": "Answer",
        "text": "Yes. Apache 2.0 grants you the right to modify and redistribute the compiler, including retargeting it to hardware Modular does not support. You cannot use the Mojo trademark for your fork, and you cannot claim Modular certification. The LLVM Exceptions also mean binaries you compile with Mojo carry no toolchain attribution obligation."
      }
    },
    {
      "@type": "Question",
      "name": "Can I contribute to the Mojo compiler?",
      "acceptedAnswer": {
        "@type": "Answer",
        "text": "Yes, with limits. Since Mojo 1.1 / MAX 26.6 on September 17, 2026, Modular accepts external compiler contributions — bug fixes only. Diagnostics, crashes, and mis-compiles with user-observable effects are in scope; changes to IR, compilation pipelines, or language semantics are not. Check `contribution-areas.md` rather than the compiler contributing page, which still carries the older, more restrictive policy."
      }
    },
    {
      "@type": "Question",
      "name": "Do I need to build the Mojo compiler from source to use Mojo?",
      "acceptedAnswer": {
        "@type": "Answer",
        "text": "No. Prebuilt nightly binaries remain the recommended path for anyone who is not modifying the compiler. Build from source when you are patching a compiler bug, retargeting to unsupported hardware, auditing code generation, or preparing a contribution — the build is a Bazel-based C++ compile of a 2,853-file tree and is not something to do casually."
      }
    },
    {
      "@type": "Question",
      "name": "Is Mojo worth learning in 2026?",
      "acceptedAnswer": {
        "@type": "Answer",
        "text": "It depends entirely on your workload. Mojo is worth learning now if you have compute-bound code you would otherwise write in C++, CUDA, or Rust, or if you are working across multiple accelerator vendors and want one language for all of them. It is not worth learning as a general-purpose backend language: the Python-superset promise was withdrawn, and the third-party ecosystem is young. Realistic speedups on a same-shape port run from roughly 4x to 150x — the 35,000x figure compares vectorized parallel Mojo against single-threaded CPython and is not a migration estimate."
      }
    }
