      "name": "What is pg_clickhouse and why does subquery pushdown matter?",
      "acceptedAnswer": {
        "@type": "Answer",
        "text": "pg_clickhouse is a PostgreSQL extension that lets you run analytics queries on ClickHouse from PostgreSQL without rewriting your SQL. It works as a foreign data wrapper (FDW): you define ClickHouse tables as foreign tables in Postgres, and the extension's planner hooks teach PostgreSQL to push as much of the query as possible down to ClickHouse as a single Remote SQL statement."
