    {
      "@type": "Question",
      "name": "What Is the OJCP Job Data Protocol, and What Is It Not?",
      "acceptedAnswer": {
        "@type": "Answer",
        "text": "OJCP is a three-part contract. A discovery layer (the well-known manifest), a tool layer (six standard MCP tools), and a trust layer (signed manifests, registry tiers, agent identity, and PII-free identity verification). Everything else in the specification — the schemas, the apply-path taxonomy, the caching rules — exists to make one of those three parts work reliably at machine speed."
      }
    },
    {
      "@type": "Question",
      "name": "Is OJCP the same as Ontario Job Creation Partnerships?",
      "acceptedAnswer": {
        "@type": "Answer",
        "text": "No. The acronym collision is unfortunate. Ontario Job Creation Partnerships is a Canadian government employment program administered by the Government of Ontario. OJCP in this article is the Open Job Context Protocol — an open specification for agent-consumable job data, authored by Austin Anderson (CTO of Recruitics) with a steering committee including Workday, CrossCountry Healthcare, Hiring.cafe, aiApply, scale.jobs, LoopCV and Tink. If your search results are showing provincial labour program pages, you want the other meaning."
      }
    },
    {
      "@type": "Question",
      "name": "Does OJCP replace my ATS?",
      "acceptedAnswer": {
        "@type": "Answer",
        "text": "No. OJCP is a layer above the ATS, not a substitute for it. The `ats_direct` apply path explicitly routes applications to your existing system (Workday, Greenhouse, Lever and similar), and the `provider_hosted` path has the job board or provider control the flow and deliver into the ATS on your behalf. Your ATS remains the system of record. What OJCP changes is how agents reach it: through a discovered manifest and typed MCP tools instead of scraping and form-fighting."
      }
    },
    {
      "@type": "Question",
      "name": "Is OJCP just MCP with a job schema bolted on?",
      "acceptedAnswer": {
        "@type": "Answer",
        "text": "Not quite — it is a vertical application of MCP, and that framing is deliberate rather than dismissive. MCP supplies the transport and the tool-calling convention; OJCP supplies the domain contract: which six tools exist, what a job manifest must declare, how apply paths are normalized, how consent scopes gate candidate fields, and how provider trust and agent identity are verified. The practical consequence is that an MCP client needs no new transport code to speak OJCP — it needs to discover a manifest. That is the standard's strongest adoption argument, and also why it adds capability rather than competing."
      }
    },
    {
      "@type": "Question",
      "name": "Is OJCP free to implement, and what does it cost me in engineering time?",
      "acceptedAnswer": {
        "@type": "Answer",
        "text": "The specification and schemas are CC BY 4.0 and the code and tooling are Apache-2.0, so licensing costs nothing. Engineering cost depends on how far you go. The minimum viable step — publishing `/.well-known/ojcp.json` with `search_jobs` — is measured in hours for a team that already has a job API. Full support, including `begin_application`, `submit_application`, consent-scoped `CandidateContext`, signed manifests and identity verification, is a real project. The recommended sequence is to ship the manifest and `search_jobs`, run `npx @ojcp/conformance` against your live domain, and only then decide whether the apply flow is worth owning."
      }
    }
