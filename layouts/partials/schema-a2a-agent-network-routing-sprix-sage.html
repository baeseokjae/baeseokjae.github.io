      "name": "What are A2A routing agents?",
      "acceptedAnswer": {
        "@type": "Answer",
        "text": "A2A routing agents are the decision layer that sits above the Agent2Agent protocol and chooses which agent configuration should execute a task, in which mode, and why. A2A itself standardizes Agent Cards, messages, tasks, artifacts, authentication, and transport; it does not define who should work on a task after execution starts. Routing agents fill that gap by scoring candidate configurations against permissions, budget, deadline, artifact portability, and observed progress."
      }
    },
    {
      "@type": "Question",
      "name": "How does the Sprix SAGE Router differ from an LLM router like RouteLLM?",
      "acceptedAnswer": {
        "@type": "Answer",
        "text": "An LLM router selects which model answers a single prompt before any execution happens. SAGE selects whether an in-flight task should stay with its incumbent (SELF), recruit complementary peers (COLLABORATE), or transfer ownership entirely (HANDOFF), after accounting for completed DAG nodes, reusable artifacts, observed partial quality, failures, budget, and deadline. The input is an execution state, not a prompt embedding, and the output is an ownership configuration, not an endpoint choice."
      }
    },
    {
      "@type": "Question",
      "name": "Is progress-aware routing actually better than ignoring progress?",
      "acceptedAnswer": {
        "@type": "Answer",
        "text": "On the project's own trajectory replay, no clear utility advantage exists: progress-aware SAGE scores 0.298 ± 0.021 against 0.291 ± 0.021 for the progress-masked variant, so the error bars overlap. The measurable differences are operational — wasted work falls from 0.104 to 0.059, added cost from 0.204 to 0.191 of budget, and the switch rate from 80.1% to 58.4%. Knowing what has been completed mostly teaches the router to leave work in place."
      }
    },
    {
      "@type": "Question",
      "name": "Can I use SAGE in production today?",
      "acceptedAnswer": {
        "@type": "Answer",
        "text": "Not as an orchestrator, and the project says so. It is an early-stage research preview: the prototype does not transmit tasks, authenticate endpoints, or verify signatures, and you remain responsible for A2A dispatch, streaming, polling, cancellation, and artifact security. What you can deploy responsibly today is a bounded adapter — offline replay, then shadow mode, then a canary slice with human approval — with the router as a replaceable policy behind your own interface, and automatic fallback to the incumbent whenever a trace reports `feasible=False`."
      }
