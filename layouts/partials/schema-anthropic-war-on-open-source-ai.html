      "name": "Is Anthropic trying to ban open-weight models?",
      "acceptedAnswer": {
        "@type": "Answer",
        "text": "No. Anthropic's position post states verbatim that \"Anthropic has never advocated for a ban on open-weights models,\" and calls open-weights models without dangerous capabilities \"a public good.\" What Anthropic supports instead is three narrower measures: chip export controls on China, enforcement against industrial-scale distillation, and mandatory pre-release safety testing for sufficiently capable models. Each of those raises costs for open-weight competitors, which is why the \"war\" framing persists despite the explicit denial."
      }

      "@type": "Question",
      "name": "What is the difference between open weights and open source?",
      "acceptedAnswer": {
        "@type": "Answer",
        "text": "Open weights means the trained parameters are published and can be downloaded, run and fine-tuned. Open source, in the traditional software sense, means the training code, data pipeline and licence permit modification and redistribution. Most \"open\" AI models are open-weight but not fully open source: Kimi K3, the largest open-weight release to date at 2.78 trillion parameters, ships under a modified-MIT licence that requires a separate agreement for Model-as-a-Service businesses above $20M in trailing revenue. The distinction matters because policy debates often use the two terms interchangeably when the obligations are quite different."
      }
    },
    {
      "@type": "Question",
      "name": "Why didn't Anthropic sign the Open Weights and American AI Leadership letter?",
      "acceptedAnswer": {
        "@type": "Answer",
        "text": "Anthropic has not given a mechanical explanation of the decision, but its position post sets out two explicit disagreements with the letter's argument. It disputes that open weights \"necessarily make it easier to develop safeguards,\" and it disputes that broad access \"necessarily helps defenders more than attackers,\" arguing biology in particular likely has \"a strong attacker-defender asymmetry.\" The letter, published July 24, 2026 with 175 signatories including every other major US frontier lab, never addresses that asymmetry directly."
      }

      "name": "Is it legal to fine-tune a model on another model's outputs?",
      "acceptedAnswer": {
        "@type": "Answer",
        "text": "It depends on the contract, not on copyright. Distillation of API outputs is governed by the terms of service you accepted when you called the endpoint. Anthropic's Claude Fable 5 system card states plainly that \"using Claude to develop competing models already violates our Terms of Service,\" and that classifiers now enforce this automatically. Training on publicly scraped text and training on a competitor's API outputs are different legal questions — the fair-use defense that applies to the former does not automatically cover the latter, which is exactly why the two sides of this debate keep talking past each other."
