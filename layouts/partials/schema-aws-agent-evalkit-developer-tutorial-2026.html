      "@type": "Question",
      "name": "Does Agent-EvalKit require Amazon Bedrock?",
      "acceptedAnswer": {
        "@type": "Answer",
        "text": "For the LLM-as-judge scoring phase, yes — it uses Bedrock to run the evaluation model. The Plan, Data, Trace, and Run Agent phases run locally. If you need a completely offline eval pipeline, you can use DeepEval as a backend with local models."
      }
    },
    {
      "@type": "Question",
      "name": "Can I use Agent-EvalKit in CI/CD?",
      "acceptedAnswer": {
        "@type": "Answer",
        "text": "Yes, but it is not the primary use case. Agent-EvalKit is designed for interactive use with a coding assistant. For CI/CD, script the CLI commands directly: evalkit plan, evalkit data, evalkit run_agent, evalkit eval, evalkit report."
      }
    },
    {
      "@type": "Question",
      "name": "How many test cases should I generate?",
      "acceptedAnswer": {
        "@type": "Answer",
        "text": "Start with 20-30 covering the most common agent flows and known edge cases. Each test case run with 5-10 iterations gives about 200-300 total agent executions, which costs about $2-5 in Bedrock judge fees."
      }

      "@type": "Question",
      "name": "How does Agent-EvalKit compare to AgentCore Evaluations?",
      "acceptedAnswer": {
