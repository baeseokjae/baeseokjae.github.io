        "text": "The AI productivity paradox is not proof that AI coding tools do not work. It is proof that local productivity and team productivity are different things. AI can be excellent for drafts, tests, examples, refactors, documentation, and unfamiliar APIs. The problem appears when teams count those outputs as value before they survive review, integration, and production."

      "name": "What is botsitting in AI-assisted work?",
      "acceptedAnswer": {
        "@type": "Answer",
        "text": "Botsitting is the human labor required to make AI output usable. It includes loading context into prompts, checking assumptions, debugging generated code, rerunning prompts, rewriting generic answers, and cleaning up edge cases. Botsitting is not wasted by default, but it must be counted when measuring AI return on investment."
      }
