      "name": "What IDEs support the ACP Agent Registry?",
      "acceptedAnswer": {
        "@type": "Answer",
        "text": "The ACP Agent Registry is available in all JetBrains IDEs running version 2025.3 or later, including IntelliJ IDEA, PyCharm, WebStorm, GoLand, Rider, CLion, DataGrip, and Android Studio. Upgrade through Help → Check for Updates to access the registry panel under Settings → Tools → AI Agents."
      }
    },
    {
      "@type": "Question",
      "name": "Is the ACP registry free to use?",
      "acceptedAnswer": {
        "@type": "Answer",
        "text": "The ACP registry itself is free — there is no charge to browse or install agents from it. However, individual agents may have their own pricing. Claude Code requires an Anthropic API key (pay-per-token), Gemini CLI has a free tier and paid tier, GitHub Copilot requires a Copilot subscription, and Koog requires a JetBrains AI Assistant subscription. OpenHands is fully open source."
      }
    },
    {
      "@type": "Question",
      "name": "How is ACP different from MCP?",
      "acceptedAnswer": {
        "@type": "Answer",
        "text": "ACP (Agent Client Protocol) governs how an AI agent communicates with the host IDE — file context, cursor position, inline edits. MCP (Model Context Protocol) governs how an agent communicates with external tools — running tests, querying a database, calling an API. In a typical setup, the IDE talks to the agent via ACP, and the agent talks to tools via MCP. They operate at different layers and are designed to be used together."
      }
    },
    {
      "@type": "Question",
      "name": "Can I build and submit my own agent to the ACP registry?",
      "acceptedAnswer": {
        "@type": "Answer",
        "text": "Yes. The registry is open. You need to implement the ACP protocol in your agent (the spec is at agentclientprotocol.com), create a valid acp.json manifest, and submit a pull request to the registry repository. JetBrains and Zed review submissions for protocol compliance before listing. There is no exclusivity requirement — you can list the same agent in both the JetBrains and Zed registries."
      }
    },
    {
      "@type": "Question",
      "name": "Does the ACP registry work with VS Code?",
      "acceptedAnswer": {
        "@type": "Answer",
        "text": "Not natively. VS Code does not have built-in ACP support as of mid-2026. VS Code-based agents use VS Code's extension API rather than ACP, which means they don't participate in the standardized ACP message stream. Developers who need both VS Code and ACP-based workflows typically run their JetBrains IDE for the ACP-heavy tasks and VS Code separately — there is no cross-editor ACP bridge currently available."
      }
    }
