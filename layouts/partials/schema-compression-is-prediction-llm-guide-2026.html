      "name": "What Does It Mean That Compression Is Prediction?",
      "acceptedAnswer": {
        "@type": "Answer",
        "text": "Compression is prediction because a good predictor implicitly assigns low code lengths to likely sequences, which is exactly what a compressor does. When you predict \"the\" follows \"of the\", you are acting like an entropy coder that gives \"the\" a short code because it is probable. The tighter your predictions match the real distribution of data, the fewer bits you need to store that data."
      }
