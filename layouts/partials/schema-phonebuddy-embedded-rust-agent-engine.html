      "name": "Is PhoneBuddy SDK free to use commercially?",
      "acceptedAnswer": {
        "@type": "Answer",
        "text": "Yes. It is Apache-2.0, so it can be embedded in proprietary apps with attribution; the repository ships a NOTICE crediting grok-build. That permissive licence is the decisive advantage over Ant Group's Napaxi, which is GPL-3.0 and has no self-serve commercial option."
      }
    },
    {
      "@type": "Question",
      "name": "Does PhoneBuddy run an LLM on the phone?",
      "acceptedAnswer": {
        "@type": "Answer",
        "text": "No. PhoneBuddy is the agent harness — planning, tools, sandbox, subagents — and ships no weights. Inference is host-supplied: you pair it with Apple Foundation Models on iOS, Gemini Nano or LiteRT-LM on Android, a GGUF runtime such as llama.rn, or a cloud provider. Its one-shot `generate_text` path deliberately has no implicit model fallback."
      }
    },
    {
      "@type": "Question",
      "name": "Does it really pass App Store and Google Play review?",
      "acceptedAnswer": {
        "@type": "Answer",
        "text": "Unverified. The README asserts that it passes both sandbox reviews with zero permission escalations, but as of 2026-10-01 no public review record, CI artifact or third-party attestation could be found — and the repository has no `.github` directory at all. Treat it as a project claim and run your own 2.5.2 and DPCLA 3.3.2 analysis before relying on it."
      }
    },
    {
      "@type": "Question",
      "name": "Does the PhoneBuddy agent engine spawn processes or use fork/exec?",
      "acceptedAnswer": {
        "@type": "Answer",
        "text": "Verified no. A full download of `main` at commit c2fc7ea contains 70 Rust files with zero `std::process::Command`, zero `tokio::process`, no `Command::new`, and no `libc::fork`, `execv`, `execl` or `posix_spawn`. File access is jailed, shell commands run as in-memory BusyBox-style applets, and JavaScript runs in a bounded `boa_engine` interpreter."
      }
    },
    {
      "@type": "Question",
      "name": "Is the embedded JavaScript engine allowed by the app stores?",
      "acceptedAnswer": {
        "@type": "Answer",
        "text": "Platform-dependent. Google Play's Device and Network Abuse policy explicitly carves out code that \"runs in a virtual machine or an interpreter where either provides indirect access to Android APIs (such as JavaScript in a webview or browser),\" which makes an embedded JS engine viable there. Apple is stricter: DPCLA 3.3.2 blesses interpreted code run by the built-in WebKit framework or JavaScriptCore, so a non-WebKit engine such as `boa_engine` is a position you argue with a reviewer, not a safe harbour."
      }
