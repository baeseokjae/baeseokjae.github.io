    {
      "@type": "Question",
      "name": "Is herdrm a coding agent console on macOS, or just a window onto one?",
      "acceptedAnswer": {
        "@type": "Answer",
        "text": "The single most important thing to understand about herdrm is that it does not run agents. It renders them. Every row you see in the sidebar comes off a Unix socket as newline-delimited JSON frames. herdrm holds no state that the herdr runtime does not already own. That architectural choice produces a failure model most agent UIs do not have: if herdrm crashes, your agents keep running, because the runtime never depended on the console. If herdr crashes, the work stops, and no amount of restarting herdrm brings it back."
      }
    },
    {
      "@type": "Question",
      "name": "How does herdrm talk to herdr (and why does that matter over SSH)?",
      "acceptedAnswer": {
        "@type": "Answer",
        "text": "herdrm connects to a herdr socket, and it treats a remote socket exactly like a local one. Remote sockets ride the normal OpenSSH path — typically `ssh -L` forwarding to the herdr daemon running on the far machine — with authentication handled by your OpenSSH config and agent, Tailscale SSH, or a password stored in the macOS Keychain. Because the transport is forwarding a Unix socket rather than inventing a second remote protocol, local and remote devices behave identically in the UI."
      }
    },
    {
      "@type": "Question",
      "name": "What is actually in the console?",
      "acceptedAnswer": {
        "@type": "Answer",
        "text": "The sidebar is organised into spaces, agents, and terminals. Each device gets an OS badge and a tint, there is a device filter in the bottom-left corner, a `Cmd-K` search for jumping to a pane, notifications, and a live terminal view. Selecting a row runs the equivalent of `herdr agent attach` and drops you into the real PTY — no chat wrapper, no re-serialised transcript, no lossy tool-call rendering."
      }
    },
    {
      "@type": "Question",
      "name": "Why does a real terminal beat a chat wrapper for coding agents?",
      "acceptedAnswer": {
        "@type": "Answer",
        "text": "Because the workflows coding agents produce are not chat-shaped. When Claude Code prints a diff, asks a permission question with a numbered menu, or opens a TUI of its own for a long-running plan, a chat-shaped client has to either emulate that UI or strip it. herdrm does neither: you get the actual pane, with shell history, logs, and running processes intact, and state rolls up from pane to tab to workspace. The same fidelity is why people keep diff viewers and pagers inside the agent session at all — they are readable only at real terminal width."
      }

      "name": "What defaults should you change before you start?",

        "@type": "Answer",
        "text": "The most consequential default in herdrm is one you should change on day one or consciously accept. The New Agent picker enables each agent's own bypass-permissions flag by default. For Claude Code, that is `--dangerously-skip-permissions`. The maintainer's justification is coherent: detached agents run unattended, so a permission prompt that nobody answers is a dead end, and a console built around background sessions cannot afford dead ends. But the tradeoff is real, and it is not just a convenience footnote. An agent started that way will not stop to ask before it writes files, runs commands, or pushes."
