    {
      "@type": "Question",
      "name": "What is a SiloLink MCP bridge used for?",
      "acceptedAnswer": {
        "@type": "Answer",
        "text": "It connects Claude Code sessions running on a remote machine to a DSiloed conversation, so you can launch, monitor, and instruct those sessions from a web UI, Slack, Discord, Teams, or SMS without SSH or a public inbound port. The MCP server is local on port 3579; the conversation layer is hosted."
      }
    },
    {
      "@type": "Question",
      "name": "Does SiloLink send my source code to DSiloed?",
      "acceptedAnswer": {
        "@type": "Answer",
        "text": "Source files and model credentials stay on your machine. Conversation text - the prompts you send and the messages Claude Code posts back - transits the DSiloed backend over an authenticated WebSocket, and the authenticating JWT is stored locally at `~/.silolink/config.json` with mode 0600."
      }
    },
    {
      "@type": "Question",
      "name": "Why does Claude Code still ask for permission when launched with `--dangerously-skip-permissions`?",
      "acceptedAnswer": {
        "@type": "Answer",
        "text": "Because the bypass flag sets the mode but does not record consent. Claude Code's internal check reads a top-level `skipDangerousModePermissionPrompt` key in `~/.claude/settings.json`, which SiloLink writes on each spawn via `ensureBypassPermissionsConsent()`. If that key is missing, dangerous-pattern commands still prompt even though the footer shows bypass as on."
      }
    },
    {
      "@type": "Question",
      "name": "Should I use `remote_poll` or `remote_wait_for_command`?",
      "acceptedAnswer": {
        "@type": "Answer",
        "text": "Use `remote_poll`. It is non-blocking and returns `{ success: true, pending: true }` when there is nothing new, so a cancelled loop cannot lose a message. `remote_wait_for_command` blocks until the next message and is documented as the less safe option."
      }
    },
    {
      "@type": "Question",
      "name": "How do I keep continuity when a Claude Code session restarts?",
      "acceptedAnswer": {
        "@type": "Answer",
        "text": "Call `remote_load_context` immediately after `remote_register`. It returns the stored `claude_resume_id` along with `message_count` and `history`, which is what lets a freshly spawned tmux session resume the prior conversation instead of starting cold. Combine it with `claude_auto_respawn` and a worktree per session for the multi-agent case."
      }
    }
  ]
