    {
      "@type": "Question",
      "name": "What Is a Mini Agent Gateway (Agent Harness) and Why Build Your Own?",
      "acceptedAnswer": {
        "@type": "Answer",
        "text": "An agent gateway — often called an agent harness — is the structured execution environment that surrounds an LLM and does most of the actual engineering work. MongoDB makes the point bluntly in its post \"The LLM Is the Smallest Part\": production agent systems are dominated by the harness that owns state, memory, tooling, routing, and guardrails, not by the model itself ([source](https://www.mongodb.com/company/blog/technical/agent-harness-the-llm-is-the-smallest-part)). A *mini* version is the same idea scaled down: a lightweight, self-hosted gateway you can build in a few hundred lines of Python rather than buying an enterprise platform."
      }
