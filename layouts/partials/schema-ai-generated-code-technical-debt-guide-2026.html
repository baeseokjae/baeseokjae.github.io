      "acceptedAnswer": {
        "@type": "Answer",
        "text": "Run a static analysis scan looking specifically for duplication ratios, cyclomatic complexity distribution, and security vulnerability density. Compare against your codebase's state from 12–18 months ago if you have historical data. Check incident rates per module against the timeline of when AI tools were introduced. Comprehension check high-traffic modules: if senior engineers can't explain them quickly, you have comprehension debt."
