      "acceptedAnswer": {

        "text": "Not strictly, but you'll want both in production. AgentCore gives you per-agent tool authorization and tracing. The gateway gives you fleet-level registry, discovery, and routing. Without AgentCore, you lose per-agent security. Without the gateway, you're back to point-to-point connections."

      "acceptedAnswer": {
        "@type": "Answer",
        "text": "Yes. The gateway uses standard OAuth 2.0 and the A2A protocol. Any agent that can present a JWT and speak HTTP can use the gateway. AWS Cloud WAN supports on-premises and other-cloud connectivity."
      }

      "name": "How does the A2A Gateway handle MCP Server Cards?",
      "acceptedAnswer": {
        "@type": "Answer",
        "text": "The gateway fetches agent cards from GET /agents/{agentId}/.well-known/agent-card.json and caches them in DynamoDB. This aligns with the MCP Server Cards standard coming in the 2026 spec cycle."
      }
    },

      "@type": "Question",

        "text": "The gateway checks health via the configured health endpoint. If an agent is unhealthy, the gateway routes around it. You can also manually set an agent's status via the /admin/agents/{agentId}/status endpoint."
