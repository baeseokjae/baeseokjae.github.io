      "@type": "Question",
      "name": "What exactly was the vulnerability?",
      "acceptedAnswer": {
        "@type": "Answer",
        "text": "A GitHub Actions script injection in `.github/workflows/jira_issue.yml`. The workflow triggered on `issues: opened` and interpolated the attacker-controlled issue title directly into a shell `run:` block, with sed-based escaping applied after GitHub's template expansion. A single quote in the title broke out of the quoted `echo` string and gave arbitrary command execution on the runner. A second bug widened it: an `if:` condition compared `github.event.pull_request.user.login` against a bot name, but on `issues` events that property is null, so the condition was always true and admitted every anonymous user."
      }
    },

      "@type": "Question",
      "name": "What is the fix for this pattern?",
      "acceptedAnswer": {
        "@type": "Answer",
        "text": "Pass untrusted values through environment variables instead of interpolating them into the script — the pattern Snowflake restored in PR #1402 was an `env:` block feeding `jq -n --arg`. Intermediate environment variables remove the injection surface entirely, because the value never becomes part of the script text. The general rule: escaping that runs after template expansion is escaping applied too late."
      }
    },
