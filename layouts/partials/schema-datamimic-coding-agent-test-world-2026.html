      "name": "What is DATAMIMIC used for?",
      "acceptedAnswer": {
        "@type": "Answer",
        "text": "DATAMIMIC generates deterministic synthetic test data and pseudonymized datasets from a declarative model file. Instead of a developer or agent hand-writing fixtures, they declare products, fields and expectations in model.dm.json, and the engine generates rows that satisfy declared constraints such as per-parent child counts and foreign key relationships. It is distributed as pip install datamimic-ce under the MIT licence, with a commercial Enterprise Edition for database connectors, PII scanning, enterprise formats and governance dashboards."
      }
    },
    {
      "@type": "Question",
      "name": "What does verified=true in DATAMIMIC actually mean?",
      "acceptedAnswer": {
        "@type": "Answer",
        "text": "It means the model passed a set of executable checks, not that the tool generated output. In a hands-on test of CE 4.3.0, a correct four-customer, two-orders-each model returned verified=true alongside deterministic_replay passed (12 rows compared, 0 mismatches) and smoke_export passed, with the acceptance block reporting 7 passed, 0 failed. Generating 5 rows while the declared exact_count stayed at 4 flipped verified to false, with the acceptance block reporting 7 passed and 1 failed and the message 'expected 4 rows but observed 5' on customers."
      }
    },
    {
      "@type": "Question",
      "name": "Is DATAMIMIC free, and what is the difference between CE and Enterprise?",
      "acceptedAnswer": {
        "@type": "Answer",
        "text": "The Community Edition is free and MIT-licensed: it ships the model parsing layer, a Python execution engine using multiprocessing with optional Ray, and the documented determinism contract. The Enterprise Edition adds a separately optimised execution engine with a Rust fastpath, a PII scanner and recommendation pipeline, database and MongoDB authoring and connections, Kafka/EDIFACT/SWIFT MT/HL7 targets, coordinated multi-system execution, RBAC and audit dashboards, on-prem or air-gapped deployment, and the JetBrains plugin — which explicitly requires EE and does not support standalone CE projects."
      }
    },
    {
      "@type": "Question",
      "name": "Does DATAMIMIC guarantee deterministic, reproducible test data?",
      "acceptedAnswer": {
        "@type": "Answer",
        "text": "Only under specific conditions. With a seed declared, datamimic scaffold --deterministic-replay compared two seeded runs of the same model and reported passed with 12 rows compared and 0 mismatches, so the engine's own replay comparison found no divergence. That is not a checksum diff of the exported files: the CSVs were not checksummed in this test, no byte-identical artefact claim is made, and the provenance hash block was not inspected. The project's AGENTS.md adds that seeded runs 'force single-process execution', so determinism is a CI-fixture property rather than a large-scale parallel-generation property."
      }
