        "@type": "Answer",

      "name": "Is Foundry Agent Service a replacement for LangGraph?",
      "acceptedAnswer": {
        "@type": "Answer",
        "text": "Foundry Agent Service is not a direct replacement for LangGraph. LangGraph is an orchestration framework, while Foundry provides a managed runtime and operational control plane. A practical architecture can use LangGraph inside a Foundry hosted agent."
      }

    {
      "@type": "Question",
      "name": "What is the difference between Memory and Foundry IQ?",
      "acceptedAnswer": {
        "@type": "Answer",
        "text": "Memory stores durable interaction context such as preferences or learned facts, while Foundry IQ grounds the agent in authoritative enterprise knowledge. Put policy documents, product docs, and reference material in grounding; put stable user-specific preferences in Memory only when retention rules allow it."
      }
    },
    {
      "@type": "Question",
      "name": "What should teams evaluate before adopting Foundry Agent Service?",
      "acceptedAnswer": {
        "@type": "Answer",
        "text": "Teams should evaluate runtime fit, framework compatibility, Entra identity design, Toolbox permissions, data residency, third-party model boundaries, Memory retention, trace visibility, evaluation coverage, and total cost. The biggest mistake is treating an agent like a prompt instead of a production service."
