    {
      "@type": "Question",
      "name": "What is Google's open agentic orchestrator (AX)?",
      "acceptedAnswer": {
        "@type": "Answer",
        "text": "AX stands for Agent Executor. It is an open-source, Go-written runtime and control plane, released under Apache 2.0 by Google, that runs agents as stateful actors rather than as microservices or batch jobs."
      }
    },
    {
      "@type": "Question",
      "name": "Why is AX not an agent framework?",
      "acceptedAnswer": {
        "@type": "Answer",
        "text": "Because its primitives contain no prompts, no planner, no graph, and no memory abstraction. Everything it exposes is about where the work runs and what it is allowed to touch."
      }
    },
    {
      "@type": "Question",
      "name": "What AX primitives exist: Task, Workspace, and Model?",
      "acceptedAnswer": {
        "@type": "Answer",
        "text": "Three declarative resources under the `ax.io/v1alpha1` API group. Each is deliberately workload-shaped and none of them is about prompting."
      }
    },
    {
      "@type": "Question",
      "name": "How does AX store state, and why not in etcd?",
      "acceptedAnswer": {
        "@type": "Answer",
        "text": "AX deliberately does not store its state in etcd. Its DESIGN.md states the reason plainly: keeping millions of short-lived tasks as Kubernetes custom resources would exceed etcd's comfort zone, both the single-digit-GB size limit and the write rate. Instead AX persists state in Redis and reconciles directly with Agent Substrate under distributed locks."
      }
    },
    {
      "@type": "Question",
      "name": "What does Agent Substrate actually do under AX?",
      "acceptedAnswer": {
        "@type": "Answer",
        "text": "Agent Substrate is the compute runtime. It is where the suspend/resume magic that everyone quotes actually happens, and it is a separate project with a separate governance path."
      }
    }
  ]
