      "acceptedAnswer": {
        "@type": "Answer",
        "text": "Best-of-N generates multiple independent attempts at one task and uses an external scoring function to choose among them. In an agentic setting the \"attempt\" is a whole trajectory — a sequence of tool calls, file reads, edits, and shell commands — not a single completion. The candidate is the final patch, but the thing you usually verify is the trajectory that produced it."
      }

      "@type": "Question",
      "name": "How Many Samples Should You Actually Buy?",
      "acceptedAnswer": {
        "@type": "Answer",
        "text": "N is a budget line, not a virtue. Four separate effects push in different directions. **The oracle curve is concave and easy to compute.** pass@N = 1 − (1 − p)^N. At p = 0.1, N = 10 gives you 65% and N = 20 gives you 88%. At p = 0.25, N = 10 already gives 94.4%. The marginal value of one more sample is Δ_N = p(1 − p)^(N−1) — it decays exponentially. Whatever N you pick, the N-th sample is worth far less than the first."
      }
