      "name": "Why Does Pi Put Its Configuration in $HOME on Linux?",
      "acceptedAnswer": {
        "@type": "Answer",
        "text": "Pi's coding agent resolves its user-level directory with a small function in `packages/coding-agent/src/config.ts`. If the environment variable is absent it falls back to `join(homedir(), CONFIG_DIR_NAME, \"agent\")`, where `CONFIG_DIR_NAME` defaults to `.pi`. On Linux that resolves to `~/.pi/agent` — a dotfolder in the home root, not `~/.config`."
      }
    },

      "acceptedAnswer": {
        "@type": "Answer",
        "text": "Both sides of this argument are reasonable, and the disagreement is about defaults rather than capability. The case for changing pi's default: `~/.pi/agent` violates a specification almost every Linux CLI tool follows, it pollutes `$HOME` for users who keep that directory curated, and it breaks the assumption behind backup and dotfile tooling that reads `$XDG_CONFIG_HOME`. The 80 reactions on issue #2870 and the 56-point Hacker News thread show that this is not a fringe preference. The gap against peers is concrete: `opencode` respects all four XDG paths."
