        "text": "AX Check is a free agent usability tester by Gauge, launched 2026-09-17. It runs 23 checklist items across four categories — Clarity (10 items), Onboarding (4), Pricing (4) and Activation (5) — and records three live coding sessions on DeepSeek V4.1 Flash, Kimi K3 and Qwen 3.8 Max using a verbatim disclosed prompt. The grade comes from the rubric only; the sessions are diagnostic evidence and do not affect the score."

    {

      "acceptedAnswer": {
        "@type": "Answer",
        "text": "Yes, it is free with no account, API key or captcha required. You can start a check with a single unauthenticated `POST https://www.ax-check.com/api/checks` carrying `{\"domain\": \"example.com\"}`, or by simply fetching `https://www.ax-check.com/example.com` — a report that does not exist yet starts the check and returns a 202 with a poll URL. Reports are readable as Markdown, JSON and per-session JSON without authentication."
      }
    },
    {
      "@type": "Question",
      "name": "What does \"unassessed\" mean on an AX Check report?",
      "acceptedAnswer": {
        "@type": "Answer",
        "text": "Unassessed means *not measured* or *not offered* — it never means failed, and unassessed items are excluded from the grade entirely rather than counted against you. fly.io demonstrates this: it scored A, 100/100 with 21 passes and 2 unassessed items, specifically no registry lookup for an SDK or packaged CLI and no agent skills surface. Do not treat an unassessed item as a defect to fix."
      }
    },
    {
      "@type": "Question",
      "name": "Why do the coding sessions sometimes contradict the score?",
      "acceptedAnswer": {
        "@type": "Answer",
        "text": "They measure different things. The rubric asks whether your surface is machine-readable; the sessions ask whether a real agent finished the job. Supabase scored 100/100 while its onboarding was recorded as `login_required` because no agent could create a hosted project or API key. pierview.ai publishes Starter $99 to Managed $999 per month, yet all three sessions refused to state a price — the report calls that model conservatism, not a site defect. Read them as two signals, never one."
      }
    },
    {
      "@type": "Question",
      "name": "What is the biggest blocker AX Check finds in real products?",
      "acceptedAnswer": {
        "@type": "Answer",
        "text": "Credential issuance, not documentation. Every autonomous-onboarding failure in the public sample set — fly.io (no `FLY_API_TOKEN`, 401 from the Machines API), bonsai.io (interactive dashboard signup only), rankor.ai (signup → email verification → login with no headless bypass), and even Supabase — failed at getting a token, not at understanding the product. Gauge's suggested answer is ephemeral accounts, simulated/static accounts claimable by a human later, or simply extending the free tier headlessly. Documentation quality gets an agent to the login wall; only a non-interactive token path gets it past."
