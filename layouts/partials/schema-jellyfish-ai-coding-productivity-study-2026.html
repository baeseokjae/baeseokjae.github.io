      "acceptedAnswer": {
        "@type": "Answer",
        "text": "AI coding tools optimize for local correctness (code compiles, tests pass) rather than systemic fit with existing architecture and conventions. Code that passes immediate review but violates deeper architectural invariants accumulates as churn — revisions and reverts that materialize weeks later. Jellyfish found a 5–11% increase in reverted code under high AI adoption; GitClear found regular AI users experience 9.4x higher code churn than non-AI users. This hidden quality cost partially offsets the throughput gains that AI tools deliver."
