<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675" role="img" aria-labelledby="t d">
  <title id="t">Truncation-policy survival matrix for a 400,110-character tool payload at a 20,000-character budget</title>
  <desc id="d">Five policies by five evidence positions. Head-N keeps the planted evidence line only at 0 percent, tail-N only at 100 percent, head+tail at 0 and 100 percent, middle-out only at 50 percent, and a pattern-centred window at all five positions.</desc>
  <rect width="1200" height="675" fill="#ffffff"/>
  <text x="60" y="74" font-family="Helvetica, Arial, sans-serif" font-size="40" font-weight="700" fill="#111111">Which 20,000 characters reach the model?</text>
  <text x="60" y="112" font-family="Helvetica, Arial, sans-serif" font-size="21" fill="#444444">400,110-char tool result &#183; 20,000-char budget &#183; one evidence line planted at five positions</text>

  <!-- column headers -->
  <g font-family="Helvetica, Arial, sans-serif" font-size="18" fill="#555555" text-anchor="middle">
    <text x="500" y="176">0%</text>
    <text x="610" y="176">25%</text>
    <text x="720" y="176">50%</text>
    <text x="830" y="176">75%</text>
    <text x="940" y="176">100%</text>
    <text x="1090" y="176">kept</text>
  </g>
  <text x="440" y="150" font-family="Helvetica, Arial, sans-serif" font-size="15" fill="#888888">evidence line position in the payload</text>

  <!-- rows -->
  <g font-family="Helvetica, Arial, sans-serif" font-size="20" fill="#111111">
    <text x="60" y="228">head-N</text>
    <text x="60" y="300">tail-N</text>
    <text x="60" y="372">head+tail</text>
    <text x="60" y="444">middle-out</text>
    <text x="60" y="516">match-centred</text>
  </g>
  <g font-family="Helvetica, Arial, sans-serif" font-size="16" fill="#777777">
    <text x="60" y="250">first 20,000 chars</text>
    <text x="60" y="322">last 20,000 chars</text>
    <text x="60" y="394">10,000 from each end</text>
    <text x="60" y="466">window on the midpoint</text>
    <text x="60" y="538">window on the first ERROR</text>
  </g>

  <!-- cells: row y-centres 220,292,364,436,508 ; x-centres 500,610,720,830,940 -->
  <g>
    <!-- head-N -->
    <rect x="482" y="202" width="36" height="36" rx="4" fill="#1f6f43"/>
    <rect x="592" y="202" width="36" height="36" rx="4" fill="#ececec"/>
    <rect x="702" y="202" width="36" height="36" rx="4" fill="#ececec"/>
    <rect x="812" y="202" width="36" height="36" rx="4" fill="#ececec"/>
    <rect x="922" y="202" width="36" height="36" rx="4" fill="#ececec"/>
    <!-- tail-N -->
    <rect x="482" y="274" width="36" height="36" rx="4" fill="#ececec"/>
    <rect x="592" y="274" width="36" height="36" rx="4" fill="#ececec"/>
    <rect x="702" y="274" width="36" height="36" rx="4" fill="#ececec"/>
    <rect x="812" y="274" width="36" height="36" rx="4" fill="#ececec"/>
    <rect x="922" y="274" width="36" height="36" rx="4" fill="#1f6f43"/>
    <!-- head+tail -->
    <rect x="482" y="346" width="36" height="36" rx="4" fill="#1f6f43"/>
    <rect x="592" y="346" width="36" height="36" rx="4" fill="#ececec"/>
    <rect x="702" y="346" width="36" height="36" rx="4" fill="#ececec"/>
    <rect x="812" y="346" width="36" height="36" rx="4" fill="#ececec"/>
    <rect x="922" y="346" width="36" height="36" rx="4" fill="#1f6f43"/>
    <!-- middle-out -->
    <rect x="482" y="418" width="36" height="36" rx="4" fill="#ececec"/>
    <rect x="592" y="418" width="36" height="36" rx="4" fill="#ececec"/>
    <rect x="702" y="418" width="36" height="36" rx="4" fill="#1f6f43"/>
    <rect x="812" y="418" width="36" height="36" rx="4" fill="#ececec"/>
    <rect x="922" y="418" width="36" height="36" rx="4" fill="#ececec"/>
    <!-- match-centred -->
    <rect x="482" y="490" width="36" height="36" rx="4" fill="#1f6f43"/>
    <rect x="592" y="490" width="36" height="36" rx="4" fill="#1f6f43"/>
    <rect x="702" y="490" width="36" height="36" rx="4" fill="#1f6f43"/>
    <rect x="812" y="490" width="36" height="36" rx="4" fill="#1f6f43"/>
    <rect x="922" y="490" width="36" height="36" rx="4" fill="#1f6f43"/>
  </g>

  <g font-family="Helvetica, Arial, sans-serif" font-size="22" font-weight="700" fill="#111111" text-anchor="middle">
    <text x="1090" y="228">1 / 5</text>
    <text x="1090" y="300">1 / 5</text>
    <text x="1090" y="372">2 / 5</text>
    <text x="1090" y="444">1 / 5</text>
    <text x="1090" y="516">5 / 5 *</text>
  </g>

  <!-- legend + footer -->
  <rect x="60" y="580" width="26" height="26" rx="3" fill="#1f6f43"/>
  <text x="96" y="600" font-family="Helvetica, Arial, sans-serif" font-size="18" fill="#333333">evidence line kept</text>
  <rect x="290" y="580" width="26" height="26" rx="3" fill="#ececec"/>
  <text x="326" y="600" font-family="Helvetica, Arial, sans-serif" font-size="18" fill="#333333">evidence line dropped</text>
  <text x="60" y="646" font-family="Helvetica, Arial, sans-serif" font-size="16" fill="#666666">* only when the failure regex matches the evidence line: pattern-informed, not position-blind. Deterministic stdlib fixture, no model call.</text>
</svg>
