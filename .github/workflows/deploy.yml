name: Deploy Hugo

on:
  push:
    branches: [main]

# gh-pages is a shared mutable branch. Serializing deploys prevents concurrent
# peaceiris/actions-gh-pages pushes from racing on its expected ref SHA.
# The site is built from the newest main commit.  Old queued deploys are
# superseded work; retaining them can strand production behind a dead queue.
concurrency:
  group: hugo-pages-deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pages: read
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Set up publication validation
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Check reviewed evidence before publication
        run: |
          python -m pip install -r tools/publication-requirements.txt
          python -m unittest discover -s tools/tests -p 'test_*.py'
          python tools/publication_gate.py changed --output publication-validation.json

      - name: Read pinned build version
        id: contract
        run: |
          python - <<'PYTHON'
          import json, os
          from pathlib import Path
          version = json.loads(Path('.hugo-build.json').read_text())['hugo_version']
          with open(os.environ['GITHUB_OUTPUT'], 'a') as f:
              f.write('hugo_version=' + version + '\n')
          PYTHON

      - name: Setup Hugo
        uses: peaceiris/actions-hugo@v3
        with:
          hugo-version: ${{ steps.contract.outputs.hugo_version }}
          extended: true

      - name: Build with verified environment
        run: |
          python tools/build_contract.py --output build-manifest.json
          HUGO_RENDER_TEST=1 python -m unittest discover -s tools/tests -p 'test_rendered_code.py'
          python tools/build_contract.py --build --output build-manifest.json

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./public

      - name: Verify exact public deployment
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python tools/verify_deployed.py --repo "$GITHUB_REPOSITORY" --commit "$GITHUB_SHA" --output live-verification.json

      - name: Send verified publication notification
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python tools/notify_publication.py

      - name: Save verification receipts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: publication-verification-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            build-manifest.json
            live-verification.json
            notification-receipt.json
          retention-days: 30
