name: Blog operations watch

on:
  schedule:
    - cron: '7,22,37,52 * * * *'
  workflow_dispatch:
    inputs:
      drill:
        description: 'Synthetic alert test; never stops production'
        type: choice
        options: [none, stale, recovery]
        default: none

concurrency:
  group: blog-operations-delivery
  cancel-in-progress: false

permissions:
  contents: write
  actions: read

jobs:
  observe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          sparse-checkout: .github/operations
          persist-credentials: false
      - name: Test delivery safety
        run: python3 -m unittest discover -s .github/operations -p 'test_*.py' -v
      - name: Check server heartbeat and public site
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          WATCH_DRILL: ${{ inputs.drill || 'none' }}
        run: python3 .github/operations/health_watch.py
      - name: Save external observation receipt
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: operations-verification-${{ github.run_id }}-${{ github.run_attempt }}
          path: operations-receipt.json
          retention-days: 30
